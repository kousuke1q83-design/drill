<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>技術士一次 予想問題ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: マークシートを思わせる解答欄。左に問題番号の一覧（解答状況）、右に問題と5つのマーク。 */
:root {
  --bg: #f4f5f2;          /* 試験用紙の生成り */
  --surface: #ffffff;
  --ink: #1d2126;
  --muted: #646a70;
  --line: #d9dcd6;
  --sheet: #c8503f;       /* マークシートの朱 */
  --sheet-soft: #f6e3df;
  --ok: #2e7d4f;  --ok-soft: #e1f1e6;
  --ng: #b33a2c;  --ng-soft: #f8e1dd;
  --sel: #22409a; --sel-soft: #e3e8f7;
  --fig-paper: #ffffff;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-exam: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181b; --surface: #1e2226; --ink: #e8eaec; --muted: #9aa1a8; --line: #343a40;
  --sheet: #e2735f; --sheet-soft: #3a2420;
  --ok: #6cc28f; --ok-soft: #1d3326; --ng: #ee7d6c; --ng-soft: #3b211d;
  --sel: #93a9ec; --sel-soft: #232c45; --fig-paper: #f7f7f4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15181b; --surface: #1e2226; --ink: #e8eaec; --muted: #9aa1a8; --line: #343a40;
  --sheet: #e2735f; --sheet-soft: #3a2420;
  --ok: #6cc28f; --ok-soft: #1d3326; --ng: #ee7d6c; --ng-soft: #3b211d;
  --sel: #93a9ec; --sel-soft: #232c45; --fig-paper: #f7f7f4; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* header */
header { padding-block: 20px 14px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; border-bottom: 2px solid var(--sheet); }
.brand { flex: 1 1 260px; min-width: 0; }
.brand small { display: block; font-size: 12px; letter-spacing: .12em; color: var(--sheet); font-weight: 700; }
.brand h1 { margin: 2px 0 0; font-family: var(--f-display); font-size: clamp(20px, 3vw, 26px); font-weight: 700; text-wrap: balance; }
.subjects { display: flex; gap: 0; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.subjects button { background: var(--surface); border: 0; padding: 8px 16px; font-weight: 700; font-size: 14px; }
.subjects button + button { border-left: 1.5px solid var(--ink); }
.subjects button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; font-size: 13px; color: var(--muted); }
.bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.bar input { accent-color: var(--sheet); width: 16px; height: 16px; }
.score { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; }
.score span { color: var(--muted); font-weight: 400; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* navigator = answer sheet */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 760px) { .sheet { position: static; max-height: none; } main { order: -1; } }
.sheet h2 { font-size: 12px; letter-spacing: .12em; color: var(--sheet); margin: 0 0 8px; }
.grp { margin-bottom: 10px; }
.grp-h { font-size: 12px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.grp-h span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.cells { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.cell { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 3px 0; font-size: 11px; line-height: 1.3; text-align: center; font-variant-numeric: tabular-nums; }
.cell b { display: block; font-size: 13px; }
.cell.done { background: var(--sel-soft); border-color: var(--sel); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.ng { background: var(--ng-soft); border-color: var(--ng); color: var(--ng); }
.cell.cur { outline: 2px solid var(--sheet); outline-offset: 1px; }
.sheet-actions { display: grid; gap: 6px; margin-top: 12px; }
.btn { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 6px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--sheet); border-color: var(--sheet); color: #fff; }
.btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; font-size: 13px; }
.btn.danger { border-color: var(--ng); color: var(--ng); }

/* question */
main { min-width: 0; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(16px, 3vw, 28px); }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.qno { font-family: var(--f-display); font-weight: 700; font-size: 18px; border: 1.5px solid var(--ink); padding: 0 10px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.qsec { font-size: 12px; color: var(--muted); }
.yobi { font-size: 11px; font-weight: 700; color: var(--sheet); border: 1px solid var(--sheet); border-radius: 3px; padding: 0 6px; }
.qtext { font-family: var(--f-exam); font-size: 16px; line-height: 1.9; max-width: 46em; }
.fig { background: var(--fig-paper); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 14px 0; overflow-x: auto; text-align: center; }
.fig svg { width: 100% !important; max-width: 520px; height: auto; }
.ov { text-decoration: overline; }

.opts { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.opt { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--f-exam); font-size: 15px; line-height: 1.75; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--sel); }
.mark { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--sheet); color: var(--sheet); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 14px; }
.opt.chosen { border-color: var(--sel); background: var(--sel-soft); }
.opt.chosen .mark { background: var(--sel); border-color: var(--sel); color: var(--surface); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mark { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); }
.opt.wrong .mark { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.opt:disabled { cursor: default; }

.verdict { margin-top: 18px; padding: 14px 16px; border-radius: 8px; border: 1.5px solid; }
.verdict.ok { border-color: var(--ok); background: var(--ok-soft); }
.verdict.ng { border-color: var(--ng); background: var(--ng-soft); }
.verdict h3 { margin: 0 0 6px; font-size: 16px; }
.verdict.ok h3 { color: var(--ok); } .verdict.ng h3 { color: var(--ng); }
.exp { font-size: 14.5px; line-height: 1.85; max-width: 48em; }
.exp b { color: var(--ink); }
.pts { font-size: 13px; color: var(--muted); margin-top: 8px; }

.navrow { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.navrow .btn { min-width: 120px; }

/* results */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(16px, 3vw, 28px); }
.result h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; }
.big { font-size: 44px; font-weight: 700; font-family: var(--f-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font-size: 18px; color: var(--muted); font-weight: 500; }
.pass { display: inline-block; margin-top: 6px; font-weight: 700; padding: 2px 10px; border-radius: 4px; }
.pass.ok { background: var(--ok-soft); color: var(--ok); } .pass.ng { background: var(--ng-soft); color: var(--ng); }
.rtable { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; font-variant-numeric: tabular-nums; }
.rtable th, .rtable td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.rtable td.n { text-align: right; }
.rbar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 60px; }
.rbar div { height: 100%; background: var(--ok); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; max-width: 72ch; }
.confirm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="brand"><small>令和8年度 技術士第一次試験</small><h1>予想問題ドリル</h1></div>
    <div class="subjects" role="group" aria-label="科目">
      <button id="sub-kiso" data-s="kiso" aria-pressed="true">基礎科目 30問</button>
      <button id="sub-ken" data-s="ken" aria-pressed="false">建設部門 40問</button>
    </div>
  </header>
  <div class="bar">
    <label><input type="checkbox" id="instant" checked> 選んだらすぐ正誤を表示</label>
    <label><input type="checkbox" id="onlyWrong"> 間違えた問題だけ表示</label>
    <div class="score" id="score"></div>
  </div>
  <div class="layout">
    <aside class="sheet" aria-label="解答状況">
      <h2>解答用紙</h2>
      <div id="cells"></div>
      <div class="sheet-actions">
        <button class="btn primary" id="grade">採点する</button>
        <div id="resetBox"><button class="btn quiet" id="reset">この科目の解答をすべて消す</button></div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const DATA = [{"id": "k1-1", "s": "kiso", "sec": "1群", "secName": "設計・計画", "no": "Ⅰ-1-1", "theme": "ユニバーサルデザイン", "q": "ユニバーサルデザインに関する次の記述のうち，最も不適切なものはどれか。", "opts": ["ユニバーサルデザインは，ロナルド・メイスにより提唱された考え方で，年齢，性別，身体的能力などの違いにかかわらず，できる限り多くの人が利用可能であるように製品や環境などをデザインすることをいう。", "バリアフリーデザインが，障害のある人や高齢者などにとっての既存の障壁を取り除くという考え方であるのに対し，ユニバーサルデザインは，はじめから多様な人が利用できることを目指して設計するという考え方である。", "ユニバーサルデザインの7原則には，「誰でも公平に使用できること」「使い方が簡単ですぐにわかること」「うっかりミスや危険につながらないデザインであること」などが含まれる。", "ユニバーサルデザインは，特定の障害のある人のために専用の製品を個別に開発することを基本とし，多くの人が共用することは想定していない。", "シャンプー容器の側面に付けられたきざみ（触覚記号）は，視覚に頼らずにリンスと区別できるようにしたもので，ユニバーサルデザインの例である。"], "ans": 4, "exp": "④が不適切。ユニバーサルデザインは，特定の人のための専用品ではなく，<b>できる限り多くの人が共通に使える<\/b>ことを目指す。<br>7原則：①公平な利用，②利用における柔軟性，③単純で直感的な利用，④認知できる情報，⑤失敗に対する寛大さ，⑥少ない身体的な努力，⑦接近や利用のためのサイズと空間。", "pts": "バリアフリーとの違い、7原則の名称、障害者差別解消法（合理的配慮）", "fig": "", "efig": ""}, {"id": "k1-2", "s": "kiso", "sec": "1群", "secName": "設計・計画", "no": "Ⅰ-1-2", "theme": "システムの信頼度（計算）", "q": "下図に示すシステムを考える。要素Aの信頼度は0.90，並列に接続された要素B，Cの信頼度はそれぞれ0.80，要素Dの信頼度は0.95である。各要素は互いに独立に故障するものとし，並列部分はB，Cのいずれか一方が正常であれば機能する。このシステム全体の信頼度に最も近い値はどれか。", "opts": ["0.547", "0.684", "0.821", "0.864", "0.912"], "ans": 3, "exp": "並列部分（B，C）の信頼度は，両方とも故障する確率を1から引いて 1−(1−0.80)²＝1−0.04＝0.96。<br>直列接続は信頼度の積なので，0.90×0.96×0.95＝<b>0.8208≒0.821<\/b>。<br>①0.547は4要素をすべて直列とみなした値（0.90×0.80×0.80×0.95）。", "pts": "直列：R＝ΠR<sub>i<\/sub>，並列：R＝1−Π(1−R<sub>i<\/sub>)，2-out-of-3（多数決）系、MTBF/(MTBF＋MTTR)＝アベイラビリティ", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 430 160\" style=\"width:95mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><line x1=\"20\" y1=\"80\" x2=\"50\" y2=\"80\" stroke=\"#1b1b1a\" stroke-width=\"1.4\"/><rect x=\"50\" y=\"60\" width=\"70\" height=\"40\" rx=\"3\" fill=\"#fff\" stroke=\"#1b1b1a\" stroke-width=\"1.4\"/><text x=\"85.0\" y=\"85.0\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"13\" font-weight=\"700\">A<\/text><text x=\"85\" y=\"118\" text-anchor=\"middle\ =\"330\" cy=\"250\" r=\"16\" fill=\"#fff\" stroke=\"#1b1b1a\" stroke-width=\"1.5\"/><text x=\"330\" y=\"255\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"13\" font-weight=\"700\">5<\/text><circle cx=\"450\" cy=\"150\" r=\"16\" fill=\"#fff\" stroke=\"#1b1b1a\" stroke-width=\"1.5\"/><text x=\"450\" y=\"155\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"13\" font-weight=\"700\">6<\/text><\/svg>"}, {"id": "k2-1", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-1", "theme": "情報セキュリティ・暗号", "q": "情報セキュリティに関する次の記述のうち，最も不適切なものはどれか。", "opts": ["パスワードに加えて，スマートフォンに送られる確認コードや生体情報など，異なる種類の要素を組み合わせる多要素認証は，不正ログイン対策として有効である。", "パスワードは，十分に長く複雑なものとし，複数のサービスで使い回さないことが重要である。", "ランサムウェアの被害に備えるには，ネットワークから切り離した媒体などにデータのバックアップを定期的に取得しておくことが有効である。", "金融機関などを装ったメールに記載されたリンクからはログインせず，あらかじめ登録した公式サイトやアプリからアクセスすることは，フィッシング対策として有効である。", "公開鍵暗号方式で機密情報を送る場合，送信者は受信者の秘密鍵を入手して情報を暗号化し，受信者は自分の公開鍵で復号する。"], "ans": 5, "exp": "⑤が不適切。公開鍵暗号方式では，送信者が <b>受信者の公開鍵<\/b> で暗号化し，受信者が <b>自分の秘密鍵<\/b> で復号する。秘密鍵は本人だけが保持し，他人に渡してはならない。<br>デジタル署名では逆に，送信者が自分の秘密鍵で署名し，受信者が送信者の公開鍵で検証する。共通鍵暗号方式は暗号化と復号に同じ鍵を使うため，鍵の配送が課題になる。", "pts": "標的型攻撃（多層防御）、ファイアウォール、ハッシュ関数、電子証明書（PKI）", "fig": "", "efig": ""}, {"id": "k2-2", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-2", "theme": "基数変換", "q": "10進数の13.625を2進数及び16進数で表したものの組合せとして，最も適切なものはどれか。", "opts": ["2進数：1101.101，16進数：D.A", "2進数：1101.101，16進数：D.5", "2進数：1011.101，16進数：B.A", "2進数：1101.011，16進数：D.6", "2進数：1011.011，16進数：B.6"], "ans": 1, "exp": "整数部13は2で割った余りを下から読んで 13＝8＋4＋1＝<b>1101<\/b>₂。小数部0.625は2を掛けて整数部を順に取り出す：0.625×2＝1.25→1，0.25×2＝0.5→0，0.5×2＝1.0→1 なので <b>0.101<\/b>₂。<br>16進数へは，小数点を基準に4桁ずつ区切る：1101.1010₂ → <b>D.A<\/b>₁₆（1101＝13＝D，1010＝10＝A）。<br>0.1₁₀のように2進数で有限桁に表せない小数もある（循環小数になる）。", "pts": "2の補数（ビット反転＋1）、IEEE 754単精度（符号1・指数8・仮数23ビット）、桁落ち", "fig": "", "efig": ""}, {"id": "k2-3", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-3", "theme": "論理式の簡単化", "q": "次の論理式Xと等価な論理式として，最も適切なものはどれか。<br>X＝(A＋B)・(A＋<span class=\"ov\">B<\/span>)<br>ただし，論理式中の＋は論理和，・は論理積を表し，<span class=\"ov\">B<\/span>はBの否定を表す。", "opts": ["B", "A・B", "A＋B", "A", "<span class=\"ov\">A<\/span>"], "ans": 4, "exp": "分配法則 (A＋B)・(A＋C)＝A＋B・C を用いると，X＝A＋B・<span class=\"ov\">B<\/span>。<br>B・<span class=\"ov\">B<\/span>＝0（矛盾）なので，X＝A＋0＝<b>A<\/b>。<br>真理値表で確かめると，A＝1のとき両括弧とも1，A＝0のとき B・<span class=\"ov\">B<\/span>＝0 となり，XはAと一致する。", "pts": "ド・モルガンの法則 <span class=\"ov\">A＋B<\/span>＝<span class=\"ov\">A<\/span>・<span class=\"ov\">B<\/span>，<span class=\"ov\">A・B<\/span>＝<span class=\"ov\">A<\/span>＋<span class=\"ov\">B<\/span>、吸収則 A＋A・B＝A、排他的論理和", "fig": "", "efig": ""}, {"id": "k2-4", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-4", "theme": "ユークリッドの互除法", "q": "ユークリッドの互除法は，自然数a，b（a＞b）に対し，aをbで割った余りをrとするとき，aとbの最大公約数がbとrの最大公約数に等しいことを利用して，余りが0になるまで割り算を繰り返す方法である。この方法で1071と462の最大公約数を求めるとき，最大公約数と，余りが0になるまでに行う割り算の回数の組合せとして，最も適切なものはどれか。", "opts": ["最大公約数 21，割り算の回数 4回", "最大公約数 7，割り算の回数 3回", "最大公約数 21，割り算の回数 3回", "最大公約数 42，割り算の回数 2回", "最大公約数 147，割り算の回数 2回"], "ans": 3, "exp": "1071＝2×462＋147 → 462＝3×147＋21 → 147＝7×21＋<b>0<\/b>。<br>3回目の割り算で余りが0になり，そのときの割る数21が最大公約数。よって <b>21，3回<\/b>。<br>検算：1071＝21×51，462＝21×22 で，51と22は互いに素。", "pts": "拡張ユークリッド互除法（ax＋by＝gcd(a，b)）、計算量のオーダ表記 O(log n)、流れ図の読み取り", "fig": "", "efig": ""}, {"id": "k2-5", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-5", "theme": "情報量（エントロピー）", "q": "4種類の記号a，b，c，dが，それぞれ1/2，1/4，1/8，1/8の確率で互いに独立に発生する情報源がある。この情報源の1記号当たりの平均情報量（エントロピー）として，最も適切なものはどれか。ただし，log₂は2を底とする対数である。", "opts": ["1.50ビット", "1.75ビット", "1.25ビット", "2.00ビット", "2.25ビット"], "ans": 2, "exp": "平均情報量 H＝−Σp<sub>i<\/sub>log₂p<sub>i<\/sub>＝(1/2)×1＋(1/4)×2＋(1/8)×3＋(1/8)×3＝0.5＋0.5＋0.375＋0.375＝<b>1.75ビット<\/b>。<br>4記号が等確率なら H＝log₂4＝2ビットで最大となる。発生確率に偏りがあると平均情報量は小さくなり，ハフマン符号（a＝0，b＝10，c＝110，d＝111）の平均符号長も1.75ビットとなる。", "pts": "可逆圧縮と非可逆圧縮、パリティビット、ハミング距離、チェックディジット（ISBN）", "fig": "", "efig": ""}, {"id": "k2-6", "s": "kiso", "sec": "2群", "secName": "情報・論理", "no": "Ⅰ-2-6", "theme": "集合（包除原理）", "q": "ある会社の技術者500人について，資格P，Q，Rの保有状況を調べたところ，Pの保有者は300人，Qは180人，Rは120人，PとQの両方の保有者は80人，QとRの両方は50人，PとRの両方は60人，P，Q，Rのすべての保有者は30人であった。P，Q，Rのいずれも保有していない技術者の人数として，最も適切なものはどれか。", "opts": ["30人", "90人", "110人", "60人", "140人"], "ans": 4, "exp": "包除原理により，少なくとも1つを保有する人数は<br>|P∪Q∪R|＝|P|＋|Q|＋|R|−|P∩Q|−|Q∩R|−|P∩R|＋|P∩Q∩R|＝300＋180＋120−80−50−60＋30＝440人。<br>いずれも保有していない人数は 500−440＝<b>60人<\/b>。", "pts": "ベン図、直積集合と写像の個数（|A|＝m，|B|＝nのとき写像はn<sup>m<\/sup>通り）、決定表", "fig": "", "efig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 270\" style=\"width:80mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><rect x=\"10\" y=\"10\" width=\"360\" height=\"250\" fill=\"#fafaf8\" stroke=\"#1b1b1a\" stroke-width=\"1\"/><text x=\"22\" y=\"30\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">全体 500人<\/text><circle cx=\"150\" cy=\"110\" r=\"72\" fill=\"#5598e7\" fill-opacity=\"0.22\" stroke=\"#5598e7\" stroke-width=\"1.6\"/><circle cx=\"230\" cy=\"110\" r=\"72\" fill=\"#e7a855\" fill-opacity=\"0.22\" stroke=\"#e7a855\" stroke-width=\"1.6\"/><circle cx=\"190\" cy=\"180\" r=\"72\" fill=\"#6cbf84\" fill-opacity=\"0.22\" stroke=\"#6cbf84\" stroke-width=\"1.6\"/><text x=\"98\" y=\"70\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"700\">P（300）<\/text><text x=\"282\" y=\"70\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"700\">Q（180）<\/text><text x=\"190\" y=\"250\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"700\">R（120）<\/text><text x=\"115\" y=\"105\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">190<\/text><text x=\"265\" y=\"105\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">80<\/text><text x=\"190\" y=\"215\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">40<\/text><text x=\"190\" y=\"88\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">50<\/text><text x=\"232\" y=\"160\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">20<\/text><text x=\"148\" y=\"160\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">30<\/text><text x=\"190\" y=\"138\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">30<\/text><text x=\"340\" y=\"240\" text-anchor=\"end\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"11\" font-weight=\"700\">どれにも該当しない 60<\/text><\/svg>"}, {"id": "k3-1", "s": "kiso", "sec": "3群", "secName": "解析", "no": "Ⅰ-3-1", "theme": "勾配ベクトル（grad）", "q": "関数 f(x，y)＝x²y＋2xy² の点(x，y)＝(1，2)における最急勾配の大きさ|grad f|として，最も適切なものはどれか。なお，grad f＝(∂f/∂x，∂f/∂y)である。", "opts": ["15", "9", "12", "21", "25"], "ans": 1, "exp": "∂f/∂x＝2xy＋2y² → (1，2)で 4＋8＝12。∂f/∂y＝x²＋4xy → 1＋8＝9。<br>|grad f|＝√(12²＋9²)＝√225＝<b>15<\/b>。<br>grad fの向きは関数値が最も急に増加する方向，その大きさが最急勾配となる。", "pts": "発散 div v＝∂u/∂x＋∂v/∂y、回転 rot、内積・外積、単位法線ベクトル", "fig": "", "efig": ""}, {"id": "k3-2", "s": "kiso", "sec": "3群", "secName": "解析", "no": "Ⅰ-3-2", "theme": "数値解析の誤差", "q": "数値計算の誤差に関する次の記述のうち，最も適切なものはどれか。", "opts": ["有限要素法において，要素分割を細かくすると，一般に離散化による近似誤差は大きくなる。", "打切り誤差とは，計算機の浮動小数点数が有限の桁数しか持たないことにより，数値を丸める際に生じる誤差である。", "絶対値の大きく異なる2つの数を加減算したときに，絶対値の大きい方の数の情報が失われることを情報落ちという。", "浮動小数点演算を単精度から倍精度に変更すると，一般に丸め誤差は大きくなる。", "値がほぼ等しい2つの数の減算を行うと，有効数字の桁数が減少することがあり，これを桁落ちという。"], "ans": 5, "exp": "⑤が適切。近い値どうしの引き算では上位の桁が打ち消し合い，有効桁数が減る（桁落ち）。式の変形（有理化など）で回避できる。<br>①要素を細かくすると近似誤差は一般に <b>小さく<\/b> なる。②は <b>丸め誤差<\/b> の説明。打切り誤差は無限級数や反復計算を有限回で打ち切ることによる誤差。③情報落ちで失われるのは <b>絶対値の小さい方<\/b> の数の情報。④倍精度にすると丸め誤差は <b>小さく<\/b> なる。", "pts": "丸め誤差・打切り誤差・桁落ち・情報落ちの区別、有限要素のゆがみと精度", "fig": "", "efig": ""}, {"id": "k3-3", "s": "kiso", "sec": "3群", "secName": "解析", "no": "Ⅰ-3-3", "theme": "差分表現", "q": "関数f(x)の点x<sub>i<\/sub>における導関数の差分表現に関する次の記述のうち，最も不適切なものはどれか。ただし，f<sub>i<\/sub>＝f(x<sub>i<\/sub>)，格子幅をh（x<sub>i+1<\/sub>＝x<sub>i<\/sub>＋h）とする。", "opts": ["1階導関数の前進差分表現は (f<sub>i+1<\/sub>−f<sub>i<\/sub>)/h である。", "1階導関数の後退差分表現は (f<sub>i<\/sub>−f<sub>i−1<\/sub>)/h である。", "1階導関数の中心差分表現は (f<sub>i+1<\/sub>−f<sub>i−1<\/sub>)/(2h) である。", "2階導関数の中心差分表現は (f<sub>i+1<\/sub>−2f<sub>i<\/sub>＋f<sub>i−1<\/sub>)/(2h²) である。", "1階導関数の中心差分表現の打切り誤差は h² に比例し，前進差分表現（h に比例）よりも精度が高い。"], "ans": 4, "exp": "④が不適切。2階導関数の中心差分は (f<sub>i+1<\/sub>−2f<sub>i<\/sub>＋f<sub>i−1<\/sub>)/<b>h²<\/b>。<br>テイラー展開 f<sub>i±1<\/sub>＝f<sub>i<\/sub>±hf'＋(h²/2)f''±(h³/6)f'''＋… を足し合わせると f<sub>i+1<\/sub>＋f<sub>i−1<\/sub>＝2f<sub>i<\/sub>＋h²f''＋O(h⁴) となり，分母はh²になる。引き算すると1階の中心差分が得られ，誤差はO(h²)（2次精度）。", "pts": "テイラー展開による誤差評価、オイラー法、ニュートン法の反復式 x<sub>n+1<\/sub>＝x<sub>n<\/sub>−f(x<sub>n<\/sub>)/f'(x<sub>n<\/sub>)", "fig": "", "efig": ""}, {"id": "k3-4", "s": "kiso", "sec": "3群", "secName": "解析", "no": "Ⅰ-3-4", "theme": "棒の引張り（応力と伸び）", "q": "下図のように，長さ2.0 m，断面積200 mm²の線形弾性体からなる棒の上端を固定し，下端に10 kNの引張荷重を軸方向に加えた。この棒の縦弾性係数（ヤング率）を200 GPaとするとき，棒に生じる垂直応力と棒の伸びの組合せとして，最も適切なものはどれか。ただし，棒の自重は無視する。", "opts": ["垂直応力 50 MPa，伸び 0.5 mm", "垂直応力 50 MPa，伸び 5.0 mm", "垂直応力 5 MPa，伸び 0.5 mm", "垂直応力 500 MPa，伸び 5.0 mm", "垂直応力 50 MPa，伸び 0.05 mm"], "ans": 1, "exp": "垂直応力 σ＝P/A＝10×10³ N / 200 mm²＝<b>50 N/mm²＝50 MPa<\/b>。<br>ひずみ ε＝σ/E＝50 / (200×10³)＝2.5×10⁻⁴。<br>伸び δ＝εL＝2.5×10⁻⁴×2000 mm＝<b>0.5 mm<\/b>（δ＝PL/(AE) で一度に計算してもよい）。<br>単位の換算（1 MPa＝1 N/mm²，1 GPa＝10³ N/mm²）でのミスが多いので注意。", "pts": "ひずみエネルギー U＝P²L/(2AE)＝Pδ/2、両端固定棒の反力配分、ポアソン比", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 250\" style=\"width:55mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><line x1=\"60\" y1=\"30\" x2=\"180\" y2=\"30\" stroke=\"#1b1b1a\" stroke-width=\"1.5\"/><line x1=\"60.0\" y1=\"30\" x : "k4-1", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-1", "theme": "原子・同位体", "q": "原子と同位体に関する次の記述のうち，最も適切なものはどれか。", "opts": ["³⁵Clと³⁷Clは，電子の数が異なるため，化学的性質が大きく異なる。", "¹⁴Cは¹²Cより陽子の数が2個多い。", "同位体どうしは，陽子の数が等しく中性子の数が異なる原子であり，化学的性質はほぼ同じである。", "ダイヤモンドと黒鉛は，互いに炭素の同位体である。", "原子番号は，原子核に含まれる中性子の数によって決まる。"], "ans": 3, "exp": "③が適切。同位体は陽子数（＝原子番号）が同じで中性子数が異なる。電子配置が同じなので化学的性質はほぼ等しい。<br>①³⁵Clも³⁷Clも陽子・電子は17個で，違いは中性子数（18と20）。②¹⁴Cの陽子数は6で¹²Cと同じ（中性子が2個多い）。④ダイヤモンドと黒鉛は <b>同素体<\/b>（同じ元素からなる単体で性質が異なるもの）。⑤原子番号は陽子の数。", "pts": "質量数＝陽子数＋中性子数、放射性同位体と半減期、電気陰性度（F＞O＞Cl…）", "fig": "", "efig": ""}, {"id": "k4-2", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-2", "theme": "酸化数", "q": "次の化学式中の［　］内の原子について，酸化数が最大のものはどれか。", "opts": ["H₂SO₄ 中の［S］", "Cr₂O₇²⁻ 中の［Cr］", "HNO₃ 中の［N］", "NH₃ 中の［N］", "KMnO₄ 中の［Mn］"], "ans": 5, "exp": "化合物中のHは＋1，Oは−2，Kは＋1とし，全体（イオンは電荷）が0になるように求める。<br>①S：2×(＋1)＋x＋4×(−2)＝0 → ＋6。②Cr：2x＋7×(−2)＝−2 → ＋6。③N：1＋x−6＝0 → ＋5。④N：x＋3＝0 → −3。⑤Mn：1＋x−8＝0 → <b>＋7<\/b>（最大）。", "pts": "酸化剤・還元剤、酸化還元反応かどうかの判定（酸化数の変化の有無）、酸の強さ（塩酸＞酢酸＞炭酸＞フェノール）", "fig": "", "efig": ""}, {"id": "k4-3", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-3", "theme": "結晶構造", "q": "金属の結晶構造に関する次の記述の，［　］に入る数値の組合せとして，最も適切なものはどれか。<br>面心立方格子（fcc）の単位格子に含まれる原子の数は［ア］個，配位数は［イ］，充填率は約［ウ］%である。これに対し，体心立方格子（bcc）の単位格子に含まれる原子の数は2個，配位数は8，充填率は約68%である。", "opts": ["ア 4，イ 12，ウ 74", "ア 4，イ 8，ウ 68", "ア 2，イ 12，ウ 74", "ア 6，イ 12，ウ 74", "ア 4，イ 6，ウ 52"], "ans": 1, "exp": "fccの単位格子：頂点の原子 8×(1/8)＝1 個，面心の原子 6×(1/2)＝3 個で，合計 <b>4個<\/b>。最近接原子数（配位数）は <b>12<\/b>，充填率は π/(3√2)≒<b>74%<\/b>（六方最密構造と同じ最密充填）。<br>bccは 8×(1/8)＋1＝2個，配位数8，充填率約68%。単純立方は1個，配位数6，約52%。<br>常温の純鉄（α鉄）はbcc，アルミニウム・銅はfcc。", "pts": "fccの格子定数aと原子半径rの関係 a＝2√2 r、bccでは a＝4r/√3", "fig": "", "efig": ""}, {"id": "k4-4", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-4", "theme": "金属材料の性質", "q": "金属材料に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["ステンレス鋼は，クロムを質量分率で約10.5%以上含む鉄合金であり，表面に形成される不働態皮膜により優れた耐食性を示す。", "アルミニウムの密度は鉄の約1/3であり，軽量化が求められる輸送機器などに広く用いられている。", "炭素鋼は，炭素の含有量が増えると硬さや強度が増加する一方で，延性やじん性は低下する。", "銅の電気抵抗率はアルミニウムの電気抵抗率よりも大きいため，送電線には主に銅が用いられている。", "チタン合金は，比強度が大きく耐食性にも優れるため，航空機部材や医療用材料に用いられている。"], "ans": 4, "exp": "④が不適切。室温の電気抵抗率は，銅 約1.7×10⁻⁸ Ω・m，アルミニウム 約2.7×10⁻⁸ Ω・m で，<b>銅の方が小さい<\/b>（電気をよく通す）。送電線に主にアルミニウム（鋼心アルミより線）が用いられるのは，軽くて安価なため。<br>大小関係の定番：密度 Cu＞Fe＞Al，電気抵抗率 Fe＞Al＞Cu，融点 Fe＞Cu＞Al。", "pts": "合金組成の質量%→原子%換算（令和元・7年度）、鉄の製錬（高炉でコークスにより還元）、腐食と不働態", "fig": "", "efig": ""}, {"id": "k4-5", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-5", "theme": "タンパク質・アミノ酸", "q": "タンパク質に関する次の記述の，［　］に入る語句の組合せとして，最も適切なものはどれか。<br>タンパク質を構成するアミノ酸は［ア］種類あり，アミノ酸どうしは［イ］結合によって鎖状につながっている。ポリペプチド鎖が部分的にとるα-ヘリックスやβ-シートは［ウ］構造と呼ばれ，主にペプチド結合間の［エ］結合によって安定化されている。", "opts": ["ア 20，イ グリコシド，ウ 二次，エ イオン", "ア 20，イ ペプチド，ウ 二次，エ 水素", "ア 12，イ ペプチド，ウ 三次，エ 水素", "ア 20，イ ペプチド，ウ 三次，エ ジスルフィド", "ア 12，イ グリコシド，ウ 二次，エ 水素"], "ans": 2, "exp": "タンパク質を構成するアミノ酸は <b>20種類<\/b>。アミノ酸のカルボキシ基と別のアミノ酸のアミノ基が脱水縮合した <b>ペプチド結合<\/b> でつながる。<br>構造の階層：一次構造（アミノ酸配列）→ <b>二次構造<\/b>（α-ヘリックス・β-シート，主鎖間の <b>水素結合<\/b>）→ 三次構造（側鎖間の相互作用やジスルフィド結合を含む立体構造）→ 四次構造（サブユニットの会合）。グリコシド結合は糖どうしの結合。", "pts": "必須アミノ酸（ヒトでは9種類）、L体とD体、酵素の基質特異性・最適温度・最適pH、変性", "fig": "", "efig": ""}, {"id": "k4-6", "s": "kiso", "sec": "4群", "secName": "材料・化学・バイオ", "no": "Ⅰ-4-6", "theme": "DNAの塩基組成（計算）", "q": "ある二本鎖DNAの一方のポリヌクレオチド鎖（鎖1）の塩基組成を調べたところ，アデニン（A）が20%，グアニン（G）が30%，シトシン（C）が15%，チミン（T）が35%であった。このとき，鎖1と相補的な鎖（鎖2）のアデニンの割合と，二本鎖DNA全体に占めるグアニンとシトシンの合計の割合（GC含量）の組合せとして，最も適切なものはどれか。", "opts": ["鎖2のA 20%，GC含量 45%", "鎖2のA 35%，GC含量 30%", "鎖2のA 15%，GC含量 45%", "鎖2のA 30%，GC含量 55%", "鎖2のA 35%，GC含量 45%"], "ans": 5, "exp": "二本鎖DNAでは A と T，G と C が対をなす（相補性）。鎖2のAは鎖1のTと対になるので <b>35%<\/b>（鎖2：A 35%，G 15%，C 30%，T 20%）。<br>GC含量は各鎖で同じで，鎖1の G＋C＝30＋15＝<b>45%<\/b>（二本鎖全体でも45%）。<br>二本鎖全体ではシャルガフの規則 A＝T，G＝C が成り立つ（A＝T＝27.5%，G＝C＝22.5%）。", "pts": "DNAとRNAの違い（RNAはTの代わりにウラシル）、PCRの3段階（熱変性・アニーリング・伸長）、DNAの熱変性とGC含量", "fig": "", "efig": ""}, {"id": "k5-1", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-1", "theme": "気候変動対策", "q": "気候変動に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["パリ協定は，世界の平均気温上昇を産業革命以前に比べて2℃より十分低く保つとともに，1.5℃に抑える努力を追求することを目標としている。", "IPCC第6次評価報告書では，人間の影響が大気，海洋及び陸域を温暖化させてきたことには疑う余地がないとされた。", "我が国は，2050年までに温室効果ガスの排出を全体としてゼロにする「2050年カーボンニュートラル」を目指すことを宣言している。", "気候変動適応法は，気候変動の影響による被害の防止・軽減を図る適応策を推進するための法律である。", "京都議定書は，先進国と途上国を区別せず，すべての締約国に温室効果ガス排出量の数値目標と削減義務を課した初めての国際的な枠組みである。"], "ans": 5, "exp": "⑤が不適切。1997年採択の京都議定書で数値目標による削減義務を負ったのは <b>先進国（附属書Ⅰ国）のみ<\/b>。途上国を含む <b>すべての締約国<\/b> が削減目標（NDC）を作成・提出する枠組みは，2015年採択の <b>パリ協定<\/b>。<br>我が国の目標：2030年度に2013年度比46%削減（50%の高みに向け挑戦），2035年度60%・2040年度73%削減（2025年2月のNDC）。", "pts": "緩和策と適応策、カーボンプライシング、GX（グリーントランスフォーメーション）", "fig": "", "efig": ""}, {"id": "k5-2", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-2", "theme": "廃棄物・プラスチック資源循環", "q": "廃棄物とその資源循環に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["我が国の産業廃棄物の年間総排出量は，一般廃棄物の年間総排出量よりも少ない。", "循環型社会形成推進基本法では，廃棄物等の処理の優先順位を，発生抑制，再使用，再生利用，熱回収，適正処分の順としている。", "プラスチックに係る資源循環の促進等に関する法律（プラスチック資源循環促進法）が2022年4月に施行され，製品の設計から廃棄物の処理までのライフサイクル全般での資源循環の取組が進められている。", "一般に5 mm以下の微細なプラスチックはマイクロプラスチックと呼ばれ，海洋生態系への影響が懸念されている。", "有害廃棄物の国境を越える移動等を規制するバーゼル条約では，2021年から，汚れたプラスチックごみなども規制の対象に加えられた。"], "ans": 1, "exp": "①が不適切。我が国の産業廃棄物の総排出量は年間約3.7億トンで，一般廃棄物（約4,000万トン）の <b>約9倍<\/b> と大きく上回る。<br>産業廃棄物の処理の流れでは，排出量の約8割が中間処理され，最終処分量は約1割未満に減量される（令和6年度に図表問題として出題）。", "pts": "3R＋Renewable、各種リサイクル法（家電・容器包装・建設・食品・自動車・小型家電）、拡大生産者責任", "fig": "", "efig": ""}, {"id": "k5-3", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-3", "theme": "LNGの体積（計算）", "q": "天然ガスは，日本まで輸送する際に容積を小さくするため，液化天然ガス（LNG）の形で運ばれている。LNGをすべてメタン（分子量16）とみなし，LNGの密度を0.425 g/cm³とする。LNGが気化して0℃，1気圧の気体になったときの体積に対し，LNGの体積はおよそ何分の1か。最も近い値はどれか。ただし，0℃，1気圧の気体1 molの体積は22.4 Lとする。", "opts": ["1/60", "1/200", "1/1000", "1/600", "1/2000"], "ans": 4, "exp": "LNG 1 cm³の質量は0.425 g，物質量は 0.425/16＝0.02656 mol。<br>0℃，1気圧の気体の体積は 0.02656×22.4＝0.595 L＝595 cm³。<br>したがって液体の体積は気体の約 1/595 ≒ <b>1/600<\/b>。<br>同じ考え方で，メタン1 molの燃焼 CH₄＋2O₂→CO₂＋2H₂O からCO₂排出量（44 g/mol）を求める問題にも対応できる。", "pts": "燃料の単位質量当たり発熱量の大小（天然ガス＞石油＞石炭＞木材）、kWh・J換算（1 kWh＝3.6 MJ）", "fig": "", "efig": ""}, {"id": "k5-4", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-4", "theme": "我が国のエネルギー事情", "q": "我が国のエネルギーに関する次の記述のうち，最も不適切なものはどれか。", "opts": ["我が国の一次エネルギー国内供給に占める化石燃料（石油，石炭，天然ガス）の割合は，8割程度である。", "太陽光発電や風力発電は，出力が天候に左右されないため，電力の需給バランスを調整するための調整力や蓄電池は必要とされない。", "我が国が輸入する原油の中東地域への依存度は，9割を超えている。", "2025年2月に閣議決定された第7次エネルギー基本計画では，2040年度の電源構成の見通しとして，再生可能エネルギーを4〜5割程度としている。", "我が国のエネルギー自給率は，他のOECD諸国と比べて低い水準にある。"], "ans": 2, "exp": "②が不適切。太陽光や風力は天候や時間帯によって出力が変動する <b>変動性再生可能エネルギー<\/b> であり，導入拡大には火力・揚水発電などの調整力，蓄電池，地域間連系線の増強などが必要になる。<br>①化石燃料依存は8割強。③原油の中東依存度は9割台半ば。④第7次エネルギー基本計画（2040年度見通し）：再エネ4〜5割程度，原子力2割程度，火力3〜4割程度。⑤自給率は1割台にとどまる。", "pts": "電源別発電電力量の構成比、一次エネルギー供給の内訳、水素・アンモニア、FIT/FIP制度", "fig": "", "efig": ""}, {"id": "k5-5", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-5", "theme": "科学技術史（年代順）", "q": "次の(ア)〜(オ)の科学史・技術史上の著名な業績を，年代の古い順から並べたものとして，最も適切なものはどれか。<br>(ア) マイケル・ファラデーによる電磁誘導の法則の発見<br>(イ) ライト兄弟による動力飛行機の初飛行<br>(ウ) ジェームズ・ワットによる蒸気機関の改良（分離凝縮器の発明）<br>(エ) ショックレー，バーディーン，ブラッテンによるトランジスタの発明<br>(オ) グラハム・ベルによる電話の発明", "opts": ["ウ → オ → ア → イ → エ", "ア → ウ → オ → イ → エ", "ウ → ア → オ → イ → エ", "ウ → ア → イ → オ → エ", "ア → ウ → イ → エ → オ"], "ans": 3, "exp": "(ウ)ワットの蒸気機関の改良：1769年（特許）→ (ア)ファラデーの電磁誘導：1831年 → (オ)ベルの電話：1876年 → (イ)ライト兄弟の初飛行：1903年 → (エ)トランジスタ：1947年。<br>よって <b>ウ→ア→オ→イ→エ<\/b>。<br>産業革命（18世紀後半）→電気の時代（19世紀）→航空・エレクトロニクス（20世紀）という流れで押さえると覚えやすい。", "pts": "ハーバー・ボッシュ法（1913年工業化）、ベッセマー転炉（1856年）、ペニシリン（1928年）、メンデレーエフの周期表（1869年）", "fig": "", "efig": ""}, {"id": "k5-6", "s": "kiso", "sec": "5群", "secName": "環境・エネルギー・技術", "no": "Ⅰ-5-6", "theme": "知的財産", "q": "我が国の知的財産権に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["特許権の存続期間は，原則として特許出願の日から20年をもって終了する。", "実用新案権の存続期間は，実用新案登録出願の日から10年をもって終了する。", "著作権は，文化庁への登録を行わなければ発生しない。", "商標権の存続期間は設定登録の日から10年であるが，更新登録の申請により更新することができる。", "意匠権の存続期間は，意匠登録出願の日から25年をもって終了する。"], "ans": 3, "exp": "③が不適切。著作権は著作物を創作した時点で自動的に発生し，登録などの手続は不要（<b>無方式主義<\/b>）。著作権の登録制度は，権利の移転を第三者に対抗するためなどに用いられる。<br>産業財産権（特許・実用新案・意匠・商標）は特許庁への出願・登録により発生 図<\/text><\/svg>", "yobi": false}, {"id": "c6", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（構造力学）", "no": "Ⅲ-6", "theme": "断面諸量", "q": "幅b，高さhの長方形断面の断面諸量に関する次の記述のうち，最も不適切なものはどれか。ただし，x軸は図心を通り幅方向に平行な軸とする。", "opts": ["x軸まわりの断面二次モーメントは bh³/12 である。", "x軸に関する断面係数は bh²/6 である。", "x軸に関する断面二次半径は h/(2√3) である。", "幅bを変えずに高さhを2倍にすると，x軸まわりの断面二次モーメントは4倍になる。", "断面の底辺を通りx軸に平行な軸まわりの断面二次モーメントは bh³/3 である。"], "ans": 4, "exp": "④が不適切。I＝bh³/12 はhの3乗に比例するので，hを2倍にすると <b>8倍<\/b> になる（断面係数Z＝bh²/6は4倍，断面積は2倍）。<br>\n②Z＝I/(h/2)＝bh²/6。③i＝√(I/A)＝√(h²/12)＝h/(2√3)。⑤平行軸の定理 I＝I<sub>G<\/sub>＋A・y²＝bh³/12＋bh(h/2)²＝bh³/3。<br>\nI形・T形断面の図心位置や断面二次モーメントは，長方形に分割して平行軸の定理を使う（中空断面は「外側−内側」で計算）。", "pts": "平行軸の定理、図心 y<sub>0<\/sub>＝ΣA<sub>i<\/sub>y<sub>i<\/sub>/ΣA<sub>i<\/sub>、台形・I形・T形断面の計算", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 205\" style=\"width:70mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><rect x=\"110\" y=\"30\" width=\"90\" height=\"140\" fill=\"#eef4fc\" stroke=\"#1b1b1a\" stroke-width=\"1.5\"/><line x1=\"80\" y1=\"100.0\" x2=\"240\" y2=\"100.0\" stroke=\"#1b1b1a\" stroke-width=\"1\" stroke-dasharray=\"6 3 2 3\"/><text x=\"246\" y=\"104.0\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"400\">x（図心軸）<\/text><circle cx=\"155.0\" cy=\"100.0\" r=\"3\" fill=\"#1b1b1a\" stroke=\"none\"/><text x=\"165.0\" y=\"94.0\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">G<\/text><line x1=\"80\" y1=\"170\" x2=\"240\" y2=\"170\" stroke=\"#8a8883\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><text x=\"246\" y=\"174\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">底辺を通る軸<\/text><line x1=\"110\" y1=\"194\" x2=\"200\" y2=\"194\" stroke=\"#1b1b1a\" stroke-width=\"0.9\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><line x1=\"110\" y1=\"188\" x2=\"110\" y2=\"200\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><line x1=\"200\" y1=\"188\" x2=\"200\" y2=\"200\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><text x=\"155.0\" y=\"189\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\">b<\/text><line x1=\"96\" y1=\"30\" x2=\"96\" y2=\"170\" stroke=\"#1b1b1a\" stroke-width=\"0.9\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><line x1=\"90\" y1=\"30\" x2=\"102\" y2=\"30\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><line x1=\"90\" y1=\"170\" x2=\"102\" y2=\"170\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><text x=\"90\" y=\"104.0\" text-anchor=\"end\" fill=\"#1b1b1a\" stroke=\"none\">h<\/text><\/svg>", "efig": "", "yobi": false}, {"id": "c7", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（鋼構造）", "no": "Ⅲ-7", "theme": "溶接継手・接合部", "q": "鋼道路橋の接合部に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["高力ボルト摩擦接合は，ボルトの締付けによって生じる継手材片間の摩擦力によって応力を伝達する接合方法である。", "完全溶込み開先溶接の有効厚（理論のど厚）は，母材の厚さの1/√2倍とする。", "等脚すみ肉溶接の理論のど厚は，脚長の1/√2倍とする。", "接合部の構造はなるべく単純にし，構成する材片の応力の伝達が明確になるようにするとともに，偏心がなるべく生じないようにする。", "断面が急変する部分では応力集中が生じるため，板厚や板幅を変化させる場合はテーパーを設けるなどして，断面をなめらかに変化させる。"], "ans": 2, "exp": "②が不適切。完全溶込み開先溶接は板厚全体が溶け込んでいるので，有効厚は <b>母材の厚さ<\/b>（厚さが異なる場合は薄い方）とする。1/√2を乗じるのはすみ肉溶接（③）ののど厚である。<br>\nその他の頻出論点：溶接の集中・交差を避ける／できるだけ下向き溶接とし上向き溶接は避ける／衝撃や繰返し応力を受ける継手は完全溶込み開先溶接とする／溶接と高力ボルトの併用の考え方。", "pts": "すみ肉溶接の有効長（まわし溶接部は含めない）、支圧接合と摩擦接合、スカラップ", "fig": "", "efig": "", "yobi": false}, {"id": "c8", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（鋼構造）", "no": "Ⅲ-8", "theme": "鋼構造の一般的特徴", "q": "鋼構造の一般的な特徴に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["鋼材は品質が均一で強度が高いため，部材断面を小さくでき，構造物の自重を軽減できる。", "部材の多くを工場で製作できるため品質管理がしやすく，現場での工期を短縮しやすい。", "一般に薄い板で構成されるため，全体座屈や局部座屈に対する配慮が必要である。", "大気中では腐食が進行するため，塗装などの防食と，それを維持するための定期的な点検・補修が必要となる。", "鋼材は高温になってもほとんど強度が低下しないため，建築物の柱やはりに用いる場合でも耐火被覆は不要である。"], "ans": 5, "exp": "⑤が不適切。鋼材は温度上昇とともに降伏点や弾性係数が低下し，おおむね300〜500℃を超えると強度が大きく低下する。このため建築物では耐火被覆が必要になる。<br>\n①〜④は鋼構造の長所・短所として定番の記述。ほかに「じん性が大きく変形能力に富む」「溶接部の疲労・脆性破壊への配慮」「再利用・リサイクルしやすい」も押さえておく。", "pts": "疲労（応力範囲と繰返し回数、継手の強度等級）、耐候性鋼材、低温脆性", "fig": "", "efig": "", "yobi": false}, {"id": "c9", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（鋼構造）", "no": "Ⅲ-9", "theme": "道路橋示方書（限界状態・作用）", "q": "「道路橋示方書・同解説Ⅰ共通編（平成29年11月）」に規定される橋の設計に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["橋の設計供用期間は，100年を標準とする。", "橋の限界状態1は，橋としての荷重を支持する能力が損なわれていない限界の状態である。", "橋の限界状態3は，部分的に荷重を支持する能力の低下が生じているが，橋としての荷重を支持する能力に及ぼす影響は限定的であり，荷重を支持する能力があらかじめ想定する範囲で確保できる限界の状態である。", "偶発作用には，衝突荷重やレベル2地震動などの影響が含まれる。", "設計状況として，永続作用支配状況，変動作用支配状況及び偶発作用支配状況を考慮する。"], "ans": 3, "exp": "③は <b>限界状態2<\/b> の定義であり不適切。限界状態3は「これを超えると構造安全性が失われる限界の状態」である。<br>\n整理：限界状態1＝損なわれていない限界／限界状態2＝能力低下はあるが影響は限定的で想定範囲内／限界状態3＝構造安全性が失われる限界。<br>\n作用は永続作用（死荷重，プレストレス，土圧など）・変動作用（活荷重，温度，風，レベル1地震動など）・偶発作用（衝突，レベル2地震動）に区分される。", "pts": "部分係数設計法、B活荷重・A活荷重、床版設計に用いるT荷重（1組の集中荷重）", "fig": "", "efig": "", "yobi": false}, {"id": "c10", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（コンクリート）", "no": "Ⅲ-10", "theme": "コンクリートの性質（フレッシュ・硬化）", "q": "コンクリートの性質に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["スランプは材料分離抵抗性を直接表す指標であり，スランプが大きいコンクリートほど材料分離が生じにくい。", "AEコンクリートは，微細な独立した空気泡を連行させることにより，凍結融解作用に対する抵抗性が向上する。", "ブリーディングとは，フレッシュコンクリートにおいて，固体材料の沈降又は分離によって練混ぜ水の一部が遊離して上昇する現象である。", "水セメント比が小さいほど，一般にコンクリートの圧縮強度は大きくなり，水密性も向上する。", "細骨材率を過度に小さくすると，コンクリートが粗々しくなり，材料分離の傾向が強まる。"], "ans": 1, "exp": "①が不適切。スランプはフレッシュコンクリートの <b>変形・流動に対する抵抗性（コンシステンシー）<\/b> の指標で，材料分離抵抗性を直接表すものではない。単位水量を増やしてスランプを大きくすると，むしろ材料分離やブリーディングが生じやすくなる。<br>\n②普通コンクリートの標準的な空気量は4.5 %程度。③ブリーディング水が表面に集まって生じる脆弱層がレイタンス。④⑤は配合設計の基本。", "pts": "ワーカビリティー、単位水量の上限、養生（湿潤・温度）、材齢28日強度", "fig": "", "efig": "", "yobi": false}, {"id": "c11", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（コンクリート）", "no": "Ⅲ-11", "theme": "セメント・混和材料", "q": "コンクリートの材料に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["早強ポルトランドセメントは，普通ポルトランドセメントの材齢7日の強さをほぼ材齢3日で発現する。", "中庸熱ポルトランドセメントは，水和熱を低く抑えるように調整されており，ダムなどのマスコンクリートに用いられる。", "高炉セメントは，長期強度の増進が期待でき，化学抵抗性に優れ，アルカリシリカ反応の抑制にも効果がある。", "フライアッシュを混和材として用いると，初期材齢における強度発現が早くなり，水和熱も増加する。", "高性能AE減水剤は，高い減水性能と良好なスランプ保持性能を併せ持つ化学混和剤である。"], "ans": 4, "exp": "④が不適切。フライアッシュはポゾラン反応により <b>長期強度の増進<\/b> に寄与するが，初期強度の発現は遅くなる。また <b>水和熱を低減<\/b> し，球形粒子のボールベアリング効果でワーカビリティーを改善し，ASR抑制にも効果がある。<br>\n①〜③⑤は正しい。混合セメント（高炉・フライアッシュ・シリカ）は初期強度が小さいため，湿潤養生期間を普通セメントより長くとる必要がある。", "pts": "セメントの種類と用途、シリカフューム、膨張材、骨材の品質（粗粒率・吸水率）", "fig": "", "efig": "", "yobi": false}, {"id": "c12", "s": "ken", "sec": "鋼構造及びコンクリート", "secName": "鋼構造及びコンクリート（コンクリート）", "no": "Ⅲ-12", "theme": "コンクリート構造物の劣化", "q": "コンクリート構造物の劣化現象に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["中性化とは，二酸化炭素がセメント水和物と炭酸化反応を起こし，細孔溶液のpHが低下する現象で，鋼材の不動態被膜が失われて鋼材腐食の原因となる。", "アルカリシリカ反応とは，外部から侵入した塩化物イオンが骨材中の鉱物と反応して生成物が膨張し，コンクリートにひび割れを生じさせる現象である。", "塩害とは，コンクリート中の塩化物イオンにより鋼材の腐食が促進され，腐食生成物の体積膨張によってひび割れやかぶりの剥離などが生じる現象である。", "凍害とは，コンクリート中の水分の凍結・融解の繰返しによって，スケーリング，微細ひび割れ，ポップアウトなどが生じる現象である。", "化学的侵食とは，酸性物質や硫酸塩などとの接触により，セメント硬化体が分解したり，膨張性の化合物が生成されたりして劣化する現象である。"], "ans": 2, "exp": "②が不適切。アルカリシリカ反応（ASR）は，骨材中の反応性シリカ鉱物と，コンクリート細孔溶液中の <b>アルカリ（Na⁺，K⁺，OH⁻）<\/b> が反応してアルカリシリカゲルが生成し，これが吸水膨張する現象である。外観は亀甲状のひび割れ，拘束方向に沿ったひび割れ，ゲルの滲出など。<br>\n対策：ASR抑制効果のある混合セメントの使用，コンクリート中のアルカリ総量を3.0 kg/m³以下に規制，無害と判定された骨材の使用。", "pts": "劣化機構と外観上の特徴の組合せ（R1再・R5）、床版の疲労、調査方法（打音・はつり・コア）", "fig": "", "efig": "", "yobi": false}, {"id": "c13", "s": "ken", "sec": "都市及び地方計画", "secName": "都市及び地方計画", "no": "Ⅲ-13", "theme": "地域地区・用途地域", "q": "都市計画法に定める地域地区に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["市街化区域については少なくとも用途地域を定めるものとし，市街化調整区域については原則として用途地域を定めないものとする。", "用途地域は，田園住居地域を含め13種類が定められている。", "特別用途地区は，用途地域内の一定の地区において，当該地区の特性にふさわしい土地利用の増進，環境の保護等の特別の目的の実現を図るため，当該用途地域の指定を補完して定める地区である。", "高度地区は，用途地域内において市街地の環境を維持し，又は土地利用の増進を図るため，建築物の高さの最高限度又は最低限度を定める地区である。", "特定用途制限地域は，市街化調整区域内において，良好な環境の形成又は保持のため，制限すべき特定の建築物等の用途の概要を定める地域である。"], "ans": 5, "exp": "⑤が不適切。特定用途制限地域は，<b>用途地域が定められていない土地の区域（市街化調整区域を除く）<\/b> 内で定める地域である。市街化調整区域はそもそも市街化を抑制すべき区域であり，開発許可制度で規制される。<br>\n②田園住居地域は2018年（平成30年）施行の改正で追加され，用途地域は13種類となった。④高度地区（高さ）と高度利用地区（容積率・建蔽率・建築面積等）の混同に注意。", "pts": "区域区分（線引き）の選択制、準都市計画区域、地区計画", "fig": "", "efig": "", "yobi": false}, {"id": "c14", "s": "ken", "sec": "都市及び地方計画", "secName": "都市及び地方計画", "no": "Ⅲ-14", "theme": "立地適正化計画・コンパクトシティ", "q": "立地適正化計画に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["立地適正化計画は，2014年の都市再生特別措置法の改正により創設された制度であり，市町村が作成することができる。", "居住誘導区域は，人口減少の中にあっても一定のエリアにおいて人口密度を維持することにより，生活サービスやコミュニティが持続的に確保されるよう，居住を誘導すべき区域である。", "都市機能誘導区域は，医療・福祉・商業等の都市機能を誘導する区域であり，居住誘導区域の外側に設定することが原則とされている。", "2020年の法改正により，居住誘導区域内で行う防災対策・安全確保策を定める「防災指針」が立地適正化計画の記載事項に位置づけられた。", "居住誘導区域外の区域で一定規模以上の住宅等の開発行為等を行おうとする場合には，原則として市町村長への届出が必要となる。"], "ans": 3, "exp": "③が不適切。都市機能誘導区域は，原則として <b>居住誘導区域の中に<\/b> 設定し，都市機能を都市の拠点に誘導・集約する。<br>\n④災害ハザードエリアにおける開発抑制とあわせて，防災指針が立地適正化計画に位置づけられた（2020年改正）。⑤届出制により緩やかに誘導するのが立地適正化計画の特徴。<br>\n関連：「コンパクト・プラス・ネットワーク」（地域公共交通計画との連携），都市の低炭素化の促進に関する法律（2012年）。", "pts": "居住誘導区域・都市機能誘導区域・誘導施設、防災指針、コンパクト・プラス・ネットワーク", "fig": "", "efig": "", "yobi": false}, {"id": "c15", "s": "ken", "sec": "都市及び地方計画", "secName": "都市及び地方計画", "no": "Ⅲ-15", "theme": "交通需要予測（4段階推定法）", "q": "交通需要予測に用いる4段階推定法に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["分布交通量の推定に用いられる重力モデルでは，ゾーン間の分布交通量は，ゾーン間の距離や所要時間に比例するものとして表される。", "発生・集中交通量は，夜間人口や従業者数などの指標を説明変数とする原単位法や回帰モデルなどを用いて推定される。", "現在パターン法は，現在のOD表のパターンをもとに，各ゾーンの発生・集中交通量の伸び率を用いて将来の分布交通量を推定する方法である。", "交通手段別分担交通量の推定には，所要時間や費用などを説明変数とするロジットモデルが用いられることがある。", "利用者均衡配分法は，「利用される経路の所要時間は皆等しく，利用されない経路の所要時間よりも小さいか，せいぜい等しい」というワードロップの第一原則に基づく配分手法である。"], "ans": 1, "exp": "①が不適切。重力モデルは，ゾーン間の交通量が各ゾーンの発生量・集中量（の累乗）に比例し，ゾーン間の距離（所要時間などの抵抗）の累乗に <b>反比例<\/b> する形で表される。<br>\n4段階推定法の手順：①発生・集中交通量 → ②分布交通量 → ③交通手段別分担交通量 → ④配分交通量。③の現在パターン法の代表例がフレーター法。⑤等時間原則＝利用者均衡，総走行時間最小＝システム最適（第二原則）。", "pts": "パーソントリップ調査、道路交通センサス、大都市交通センサス、時間平均速度と空間平均速度", "fig": "", "efig": "", "yobi": false}, {"id": "c16", "s": "ken", "sec": "都市及び地方計画", "secName": "都市及び地方計画", "no": "Ⅲ-16", "theme": "国土形成計画", "q": "国土形成計画に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["国土づくりの転換を迫る新たな潮流を踏まえ，2005年に国土総合開発法が抜本的に改正され，国土形成計画法となった。", "国土形成計画は，全国計画と広域地方計画からなる。", "第三次国土形成計画（全国計画）は2023年7月に閣議決定され，目指す国土の姿として「新時代に地域力をつなぐ国土」を掲げている。", "広域地方計画は，各ブロックの都道府県知事が共同で策定し，国土交通大臣の承認を受けて決定される。", "第三次国土形成計画では，国土構造の基本構想として「シームレスな拠点連結型国土」を掲げ，デジタルとリアルが融合した「地域生活圏」の形成を重視している。"], "ans": 4, "exp": "④が不適切。広域地方計画は，国の地方支分部局，関係都府県・政令市，地元経済団体等で構成する <b>広域地方計画協議会<\/b> での協議を経て，<b>国土交通大臣が決定<\/b> する（全国計画は閣議決定）。対象ブロックは首都圏，近畿圏，中部圏など8ブロック（北海道・沖縄は別法に基づく計画）。<br>\n歴史：一全総（1962，拠点開発方式）→新全総（1969，大規模プロジェクト）→三全総（1977，定住構想）→四全総（1987，多極分散型国土）→21世紀の国土のグランドデザイン（1998，多軸型国土）→国土形成計画（2008，2015，2023）。", "pts": "全総の開発方式の変遷、二層の広域圏、対流促進型国土（第二次）", "fig": "", "efig": "", "yobi": false}, {"id": "c17", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（水理学）", "no": "Ⅲ-17", "theme": "静水圧（全水圧と作用点）", "q": "鉛直に立てられた長方形の壁（幅1 m）の片側に，水深3.0 mの静水が接している。壁に作用する全水圧Pと，その作用点の水面からの深さh<sub>c<\/sub>の組合せとして，最も適切なものはどれか。ただし，水の単位体積重量は9.8 kN/m³とし，大気圧は考慮しない。", "opts": ["P＝44.1 kN，h<sub>c<\/sub>＝1.5 m", "P＝44.1 kN，h<sub>c<\/sub>＝2.0 m", "P＝88.2 kN，h<sub>c<\/sub>＝2.0 m", "P＝29.4 kN，h<sub>c<\/sub>＝2.0 m", "P＝88.2 kN，h<sub>c<\/sub>＝1.0 m"], "ans": 2, "exp": "静水圧は水深に比例する三角形分布（底面で p＝ρgh＝9.8×3.0＝29.4 kN/m²）。<br>\n全水圧 P＝(1/2)ρgh²×幅＝(1/2)×9.8×3.0²×1＝<b>44.1 kN<\/b>。<br>\n作用点は三角形分布の図心で，水面から (2/3)h＝<b>2.0 m<\/b>（底面から h/3）。<br>\n一般式：h<sub>c<\/sub>＝h<sub>G<\/sub>＋I<sub>G<\/sub>/(h<sub>G<\/sub>A)。長方形では h<sub>G<\/sub>＝1.5 m，I<sub>G<\/sub>/(h<sub>G<\/sub>A)＝(1×3³/12)/(1.5×3)＝0.5 m より 2.0 m。④の29.4は底面の水圧強度。", "pts": "ベルヌーイの定理（位置・圧力・速度水頭）、ピトー管、連続の式", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 185\" style=\"width:72mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><rect x=\"220\" y=\"15\" width=\"14\" height=\"155\" fill=\"#c9c6bf\" stroke=\"#1b1b1a\" stroke-width=\"1.3\"/><rect x=\"60\" y=\"30\" width=\" t=\"url(#ar)\" marker-end=\"url(#ar)\"/><line x1=\"74\" y1=\"30\" x2=\"86\" y2=\"30\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><line x1=\"74\" y1=\"170\" x2=\"86\" y2=\"170\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><text x=\"86\" y=\"104.0\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\">h＝3.0 m<\/text><text x=\"242\" y=\"95\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">壁（幅1 m）<\/text><\/svg>", "efig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 195\" style=\"width:90mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"arA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1c5cab\"/><\/marker><\/defs><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><rect x=\"250\" y=\"12\" width=\"14\" height=\"163\" fill=\"#c9c6bf\" stroke=\"#1b1b1a\" stroke-width=\"1.2\"/><path d=\"M250,25 L250,175 L130,175 Z\" fill=\"#86b6ef\" fill-opacity=\"0.45\" stroke=\"#1c5cab\" stroke-width=\"1.4\"/><line x1=\"226.0\" y1=\"55\" x2=\"248\" y2=\"55\" stroke=\"#1c5cab\" stroke-width=\"0.9\" marker-end=\"url(#arA)\"/><line x1=\"205.2\" y1=\"81\" x2=\"248\" y2=\"81\" stroke=\"#1c5cab\" stroke-width=\"0.9\" marker-end=\"url(#arA)\"/><line x1=\"184.4\" y1=\"107\" x2=\"248\" y2=\"107\" stroke=\"#1c5cab\" stroke-width=\"0.9\" marker-end=\"url(#arA)\"/><line x1=\"163.6\" y1=\"133\" x2=\"248\" y2=\"133\" stroke=\"#1c5cab\" stroke-width=\"0.9\" marker-end=\"url(#arA)\"/><line x1=\"142.8\" y1=\"159\" x2=\"248\" y2=\"159\" stroke=\"#1c5cab\" stroke-width=\"0.9\" marker-end=\"url(#arA)\"/><text x=\"125\" y=\"191\" text-anchor=\"middle\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">ρgh＝29.4 kN/m²<\/text><line x1=\"80\" y1=\"125.0\" x2=\"247\" y2=\"125.0\" stroke=\"#1b1b1a\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"/><text x=\"74\" y=\"129.0\" text-anchor=\"end\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">P＝44.1 kN<\/text><line x1=\"290\" y1=\"25\" x2=\"290\" y2=\"125.0\" stroke=\"#1b1b1a\" stroke-width=\"0.9\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><line x1=\"284\" y1=\"25\" x2=\"296\" y2=\"25\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><line x1=\"284\" y1=\"125.0\" x2=\"296\" y2=\"125.0\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><text x=\"296\" y=\"79.0\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\">2h/3＝2.0 m<\/text><line x1=\"290\" y1=\"125.0\" x2=\"290\" y2=\"175\" stroke=\"#1b1b1a\" stroke-width=\"0.9\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><line x1=\"284\" y1=\"125.0\" x2=\"296\" y2=\"125.0\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><line x1=\"284\" y1=\"175\" x2=\"296\" y2=\"175\" stroke=\"#1b1b1a\" stroke-width=\"0.8\"/><text x=\"296\" y=\"154.0\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\">h/3<\/text><line x1=\"100\" y1=\"25\" x2=\"250\" y2=\"25\" stroke=\"#1c5cab\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"100\" y=\"20\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">水面<\/text><\/svg>", "yobi": false}, {"id": "c18", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（河川）", "no": "Ⅲ-18", "theme": "河川の流出解析", "q": "河川の流出解析に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["合理式は，ピーク流量Q［m³/s］を，流出係数f，洪水到達時間内の平均降雨強度r［mm/h］，流域面積A［km²］を用いて Q＝(1/3.6)・f・r・A で求める式である。", "合理式で用いる降雨強度は，洪水到達時間内の平均降雨強度である。", "貯留関数法は，流域の貯留量と流出量との間に非線形の関係を仮定して流出量を求める方法である。", "単位図法（ユニットハイドログラフ法）は，降雨と流出の関係に線形性と時不変性を仮定する方法である。", "流出係数は，流域の市街化が進み不浸透面積が増加すると，一般に小さくなる。"], "ans": 5, "exp": "⑤が不適切。市街化により舗装や屋根などの不浸透面積が増えると，雨水の地中浸透が減るため流出係数は <b>大きくなり<\/b>，洪水到達時間も短くなる（ピーク流量が増大）。<br>\n①の1/3.6は単位換算係数（mm/h×km²→m³/s）。合理式は比較的小流域・都市河川に，貯留関数法は大流域の洪水流出計算に用いられることが多い。", "pts": "洪水到達時間、タンクモデル、分布型流出モデル、流出成分（表面流出・中間流出・地下水流出）", "fig": "", "efig": "", "yobi": false}, {"id": "c19", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（水理学）", "no": "Ⅲ-19", "theme": "開水路の流れ", "q": "一様勾配・一様断面の開水路の流れに関する次の記述のうち，最も不適切なものはどれか。", "opts": ["フルード数が1より小さい流れを常流，1より大きい流れを射流という。", "流量が一定のとき，比エネルギーが最小となる水深を限界水深という。", "常流から射流に遷移する箇所では，跳水が生じる。", "マニングの平均流速公式では，平均流速は径深の2/3乗と水面勾配（エネルギー勾配）の1/2乗に比例する。", "長方形断面水路における限界水深h<sub>c<\/sub>は，単位幅流量をq，重力加速度をgとすると，h<sub>c<\/sub>＝(q²/g)<sup>1/3<\/sup>で表される。"], "ans": 3, "exp": "③が不適切。跳水は <b>射流から常流<\/b> に遷移する際に水面が不連続的に跳ね上がる現象で，大きなエネルギー損失を伴う（減勢工に利用）。常流から射流への遷移（例：勾配変化点，堰の越流部）では水面は連続的に低下し，その断面に限界水深が現れる。<br>\n①Fr＝v/√(gh)。④v＝(1/n)R<sup>2/3<\/sup>I<sup>1/2<\/sup>。⑤限界水深では比エネルギーE＝(3/2)h<sub>c<\/sub>。", "pts": "等流水深、緩勾配・急勾配水路、支配断面、比エネルギー図", "fig": "", "efig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 380 205\" style=\"width:85mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><line x1=\"60\" y1=\"190\" x2=\"360\" y2=\"190\" stroke=\"#1b1b1a\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><line x1=\"60\" y1=\"190\" x2=\"60\" y2=\"15\" stroke=\"#1b1b1a\" stroke-width=\"1\" marker-end=\"url(#ar)\"/><text x=\"360\" y=\"206\" text-anchor=\"end\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">比エネルギー E<\/text><text x=\"54\" y=\"25\" text-anchor=\"end\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">水深 h<\/text><path d=\"M349.6,156.6 L340.8,155.9 L332.6,155.3 L324.8,154.6 L317.6,153.9 L310.8,153.2 L304.4,152.6 L298.4,151.9 L292.8,151.2 L287.5,150.6 L282.5,149.9 L277.8,149.2 L273.3,148.5 L269.1,147.8 L265.2,147.2 L261.5,146.5 L257.9,145.8 L254.6,145.2 L251.5,144.5 L248.5,143.8 L245.7,143.1 L243.1,142.4 L240.6,141.8 L238. L276.7,31.8 L277.5,31.1 L278.2,30.4 L279.0,29.7 L279.8,29.1 L280.6,28.4 L281.4,27.7 L282.2,27.0 L283.0,26.3 L283.8,25.7\" stroke=\"#1c5cab\" stroke-width=\"1.8\"/><line x1=\"60\" y1=\"190\" x2=\"274.5\" y2=\"25.0\" stroke=\"#8a8883\" stroke-dasharray=\"4 3\"/><text x=\"278.5\" y=\"25.0\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">E＝h<\/text><line x1=\"60\" y1=\"115.0\" x2=\"206.25\" y2=\"115.0\" stroke=\"#1b1b1a\" stroke-dasharray=\"3 3\"/><circle cx=\"206.25\" cy=\"115.0\" r=\"3.5\" fill=\"#1c5cab\" stroke=\"none\"/><text x=\"54\" y=\"119.0\" text-anchor=\"end\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"400\">h<tspan font-size='9' dy='3'>c<\/tspan><\/text><text x=\"214.25\" y=\"119.0\" text-anchor=\"start\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">E<tspan font-size='9' dy='3'>min<\/tspan><tspan dy='-3'>（限界流）<\/tspan><\/text><text x=\"235\" y=\"72\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">常流（h＞h<\/text><text x=\"308\" y=\"72\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"9\" font-weight=\"400\">c<\/text><text x=\"314\" y=\"72\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">）<\/text><text x=\"235\" y=\"162\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">射流（h＜h<\/text><text x=\"308\" y=\"162\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"9\" font-weight=\"400\">c<\/text><text x=\"314\" y=\"162\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">）<\/text><\/svg>", "yobi": false}, {"id": "c20", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（河川）", "no": "Ⅲ-20", "theme": "流砂・河床変動", "q": "河川における土砂移動に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["浮遊砂は，河床と間断なく接触しながら，滑動・転動・小跳躍によって河床近傍を移動する土砂である。", "ウォッシュロードは，河床材料にはほとんど含まれない微細な粒子からなり，流水中に浮遊して流下する。", "河床に作用する掃流力が限界掃流力を上回ると，河床の砂礫は移動を開始する。", "小規模河床形態には砂漣や砂堆，反砂堆があり，フルード数が大きい流れでは反砂堆が形成されやすい。", "ダム下流などで上流からの土砂供給が減少すると，河床の細粒分が選択的に流出して表層が粗粒化するアーマリングが生じることがある。"], "ans": 1, "exp": "①は <b>掃流砂<\/b> の説明であり不適切。浮遊砂は，流れの乱れによって河床から巻き上げられ，水中に浮遊して流下する土砂である。<br>\n輸送形態：掃流砂（河床近傍）・浮遊砂（乱れで浮遊）・ウォッシュロード（河床材料に由来しない微細粒子）。<br>\n④中規模河床形態としては交互砂州・複列砂州がある。限界掃流力の算定には岩垣式などが用いられる。", "pts": "シールズ数、河床低下と局所洗掘、ダム堆砂、総合土砂管理", "fig": "", "efig": "", "yobi": false}, {"id": "c21", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（河川）", "no": "Ⅲ-21", "theme": "河川堤防", "q": "河川堤防に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["堤防は，原則として盛土により築造するものとされている（土堤原則）。", "堤防の余裕高は，計画高水流量に応じて定められている。", "堤防の天端幅は，堤防の高さと堤内地盤高との差が0.6 m未満である区間を除き，計画高水流量に応じて定められた値以上とする。", "浸透対策としてのドレーン工は，堤体の川表側に透水性の低い材料を設置して，河川水の堤体内への浸透を防止する工法である。", "堤防の浸透に対する安全性照査では，すべり破壊に対する安全性と，基礎地盤のパイピング破壊に対する安全性を照査する。"], "ans": 4, "exp": "④が不適切。ドレーン工は堤体 <b>川裏側のり尻部<\/b> に透水性の高い材料を設置し，堤体内に浸透した水を速やかに排水して浸潤線を低下させ，すべり破壊を防ぐ工法である。河川水の浸透を川表側で抑えるのは表のり面被覆工（遮水シート等）や遮水矢板。<br>\n①〜③は河川管理施設等構造令の規定。⑤パイピングは局所動水勾配や裏のり尻の揚圧力で照査する。", "pts": "高規格堤防、越水に対する粘り強い河川堤防、堤防の質的整備", "fig": "", "efig": "", "yobi": false}, {"id": "c22", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（河川）", "no": "Ⅲ-22", "theme": "河川計画・流域治水", "q": "河川計画に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["河川整備基本方針では，長期的な視点に立った河川整備の基本となるべき方針として，基本高水やその河道と洪水調節施設への配分などを定める。", "河川整備計画は，河川整備基本方針に沿って，今後20〜30年間に行う具体的な河川整備の内容を定めるものであり，必要に応じて学識経験者や関係住民の意見を反映させる手続がとられる。", "2021年には，特定都市河川浸水被害対策法等の一部を改正する法律（いわゆる流域治水関連法）が成立し，流域のあらゆる関係者が協働して水災害対策を行う「流域治水」の実効性を高める仕組みが整備された。", "気候変動の影響を踏まえ，河川整備基本方針の見直しでは，2℃上昇相当のシナリオにおける降雨量の増加（約1.1倍）を考慮して基本高水を設定する考え方が示されている。", "一級河川の管理は都道府県知事が行い，二級河川の管理は国土交通大臣が行う。"], "ans": 5, "exp": "⑤が不適切。<b>一級河川は国土交通大臣<\/b> が管理し（指定区間は都道府県知事に管理の一部を委任），<b>二級河川は都道府県知事<\/b> が管理する。準用河川は市町村長が管理する。<br>\n①基本方針は国土交通大臣が社会資本整備審議会の意見を聴いて定める（一級河川）。④気候変動を踏まえた治水計画のあり方提言（2019年・2021年改訂）による。", "pts": "計画規模（超過確率年）、計画高水位、流域治水プロジェクト、特定都市河川", "fig": "", "efig": "", "yobi": false}, {"id": "c23", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（海岸）", "no": "Ⅲ-23", "theme": "波の性質", "q": "海の波の性質に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["水深が波長の1/2より大きい場所の波を深海波といい，微小振幅波理論によると深海波の波速は周期のみによって定まる。", "水深が波長に比べて十分小さい場所の波（長波）の波速は，周期に比例する。", "有義波とは，ある地点で観測された波群のうち，波高の大きいものから全体の1/3の個数の波を選び，その波高と周期を平均したものである。", "波が浅い海域に入ると，浅水変形により波高はいったん減少した後に増大し，やがて砕波する。", "波の屈折により，波の進行方向は等深線に直交する方向に近づくように変化する。"], "ans": 2, "exp": "②が不適切。長波（浅水波）の波速は C＝√(gh) で，<b>水深のみ<\/b> によって定まり周期には依存しない（津波は長波の代表例）。<br>\n①深海波：C＝gT/(2π)，L＝gT²/(2π)。周期が2倍になると波長は4倍，波速は2倍。③有義波は1/3最大波ともいい，目視観測の波高に近い。⑤屈折により岬には波が集中し，湾奥では波が発散しやすい。", "pts": "回折（防波堤背後への回り込み）、砕波、ウェーブセットアップ、潮汐（天文潮・気象潮）", "fig": "", "efig": "", "yobi": false}, {"id": "c24", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（海岸）", "no": "Ⅲ-24", "theme": "海岸保全施設", "q": "海岸保全施設に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["設計高潮位は，朔望平均満潮位に既往の最大潮位偏差又は推算した潮位偏差を加えたものなどから定められる。", "ハドソン式は，傾斜堤等の斜面を被覆する捨石やコンクリートブロックの所要質量を算定する式であり，所要質量は設計波高の3乗に比例する。", "離岸堤は，汀線に対してほぼ直角方向に突き出して設置され，沿岸漂砂を捕捉して汀線を前進させる施設である。", "人工リーフは，天端水深をある程度確保した幅の広い潜堤であり，波を砕波させて波浪を減衰させるとともに，景観への影響が小さい。", "堤防の天端高は，設計高潮位に設計波の打上げ高又は許容越波流量に対応する高さを加え，必要に応じて余裕高を加えて定める。"], "ans": 3, "exp": "③は <b>突堤<\/b> の説明であり不適切。離岸堤は汀線からある程度離れた沖側に <b>汀線とほぼ平行<\/b> に設置し，消波と堤体背後への砂の堆積（トンボロ・舌状砂州）を促す施設である。<br>\n②ハドソン式：M＝ρ<sub>r<\/sub>H³/{K<sub>D<\/sub>(S<sub>r<\/sub>−1)³cotα}。設計波高が2倍になると所要質量は8倍。", "pts": "養浜（静的・動的）、ヘッドランド、面的防護方式、津波に対する粘り強い構造", "fig": "", "efig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 430 178\" style=\"width:105mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1c5cab\"/><\/marker><\/defs><text x=\"105\" y=\"16\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">離岸堤<\/text><rect x=\"10\" y=\"26\" width=\"190\" height=\"130\" fill=\"#86b6ef\" fill-opacity=\"0.3\" stroke=\"none\"/><text x=\"188\" y=\"44\" text-anchor=\"end\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">海<\/text><path d=\"M10,118 C60,118 80,96 105,92 C130,96 150,118 200,118 L200,156 L10,156 Z\" fill=\"#f4e7b8\" stroke=\"#1b1b1a\" stroke-width=\"1\"/><rect x=\"70\" y=\"62\" width=\"70\" height=\"9\" fill=\"#8a8883\" stroke=\"#1b1b1a\"/><text x=\"105\" y=\"56\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">離岸堤（汀線と平行）<\/text><text x=\"105\" y=\"140\" text-anchor=\"middle\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">背後に舌状砂州・トンボロ<\/text><text x=\"20\" y=\"170\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">陸<\/text><text x=\"325\" y=\"16\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">突堤<\/text><rect x=\"230\" y=\"26\" width=\"190\" height=\"130\" fill=\"#86b6ef\" fill-opacity=\"0.3\" stroke=\"none\"/><text x=\"408\" y=\"44\" text-anchor=\"end\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">海<\/text><path d=\"M230,118 L315,104 L315,118 L420,122 L420,156 L230,156 Z\" fill=\"#f4e7b8\" stroke=\"#1b1b1a\" stroke-width=\"1\"/><rect x=\"315\" y=\"52\" width=\"9\" height=\"70\" fill=\"#8a8883\" stroke=\"#1b1b1a\"/><text x=\"330\" y=\"48\" text-anchor=\"start\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">突堤（汀線に直角）<\/text><path d=\"M250,80 L300,80\" stroke=\"#1c5cab\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"240\" y=\"74\" text-anchor=\"start\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">沿岸漂砂<\/text><text x=\"325\" y=\"140\" text-anchor=\"middle\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">上手側に堆砂<\/text><text x=\"240\" y=\"170\" text-anchor=\"start\" fill=\"#8a8883\" stroke=\"none\" font-size=\"11\" font-weight=\"400\">陸<\/text><\/svg>", "yobi": false}, {"id": "c25", "s": "ken", "sec": "港湾及び空港", "secName": "港湾及び空港", "no": "Ⅲ-25", "theme": "港湾施設・防波堤", "q": "港湾施設に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["防波堤は，航路や泊地とともに，港湾の水域施設に分類される。", "混成堤は，捨石マウンドの上に直立壁を設けた構造であり，マウンドが高い場合には傾斜堤，低い場合には直立堤に近い機能を持つ。", "ケーソン式混成堤の直立部に作用する波力の算定には，一般に合田式が用いられる。", "岸壁，桟橋，物揚場などは，船舶を係留して荷役や乗降を行うための係留施設である。", "港内の静穏度は，荷役が可能な日数の割合（荷役稼働率）などで評価される。"], "ans": 1, "exp": "①が不適切。防波堤は防潮堤・護岸・水門などとともに <b>外郭施設<\/b> に分類される。水域施設は航路，泊地，船だまりなど船舶が航行・停泊する水域である。<br>\n③合田式は砕波・重複波を連続的に扱える波圧式（衝撃砕波圧が懸念される場合は別途検討）。⑤係留施設の前面泊地では，年間を通じて97.5 %以上の荷役稼働率を確保することが目安とされる。", "pts": "港湾計画、傾斜堤・直立堤・混成堤の特徴、滑走路長・着陸帯・RESA（空港）", "fig": "", "efig": "", "yobi": false}, {"id": "c26", "s": "ken", "sec": "河川、砂防及び海岸・海洋", "secName": "河川、砂防及び海岸・海洋（砂防）", "no": "Ⅲ-26", "theme": "砂防施設・土石流", "q": "砂防に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["砂防堰堤は，土砂を捕捉・調節するほか，渓床勾配を緩和して渓床の縦侵食を防止し，渓岸の崩壊を抑制する機能を持つ。", "透過型砂防堰堤は，平常時の土砂は下流に流下させ，土石流発生時には巨礫や流木を捕捉するように計画される。", "土石流は，一般に渓床勾配が15°程度以上の区間で発生し，勾配が緩くなるにつれて減速し，堆積していく。", "流路工は，扇状地など土砂が堆積しやすい区域において流路を固定し，乱流や偏流を防止するとともに，縦断勾配を規制して河床の安定を図るものである。", "床固工は，主として渓岸の侵食を防止する目的で，渓流の流下方向に沿って縦断的に設置される構造物である。"], "ans": 5, "exp": "⑤が不適切。床固工は渓流を <b>横断<\/b> して設置し，渓床の縦侵食を防止して渓床を安定させるとともに，護岸などの基礎を保護する施設である。渓岸の侵食防止は護岸工・水制工の役割。<br>\n③土石流の発生・流下・堆積区間の勾配の目安（発生15°以上，流下10°以上，堆積は10°程度から減速）は頻出。砂防堰堤の水通しは土石流・流木を安全に流下させられる断面とする。", "pts": "土砂災害防止法（警戒区域・特別警戒区域）、地すべり防止施設（抑制工・抑止工）、流木対策", "fig": "", "efig": "", "yobi": false}, {"id": "c27", "s": "ken", "sec": "電力土木", "secName": "電力土木", "no": "Ⅲ-27", "theme": "再生可能エネルギー", "q": "我が国の再生可能エネルギーに関する次の記述のうち，最も適切なものはどれか。", "opts": ["太陽光発電は，天候や時間帯に左右されずに安定した出力が得られるため，ベースロード電源として位置づけられている。", "再生可能エネルギーの導入支援策として，固定価格買取制度（FIT）に加え，2022年度から市場価格に一定のプレミアムを上乗せするFIP制度が導入された。", "地熱発電は，我が国の地熱資源量が世界有数であることを背景に，国内の発電電力量に占める割合が10 %を超える主力電源となっている。", "洋上風力発電は，着床式のみが我が国の海域で実用化可能とされており，浮体式は技術的に導入が不可能とされている。", "バイオマス発電は，燃焼時に二酸化炭素を排出するため，カーボンニュートラルな発電方式とはみなされない。"], "ans": 2, "exp": "②が適切。FIP（Feed-in Premium）制度は2022年4月に開始され，再エネ電源を電力市場に統合していく仕組みである。<br>\n①太陽光・風力は出力が変動する「変動性再エネ」であり，ベースロード電源ではない。③地熱は資源量が世界第3位級だが，発電電力量の割合は1 %未満にとどまる。④浮体式洋上風力も実証・導入が進められている（再エネ海域利用法に基づく促進区域の指定など）。⑤バイオマスは成長過程でCO₂を吸収するため，カーボンニュートラルとされる。", "pts": "電源構成の推移（表問題：R2・R7）、中小水力・包蔵水力、エネルギー基本計画", "fig": "", "efig": "", "yobi": false}, {"id": "c28", "s": "ken", "sec": "電力土木", "secName": "電力土木", "no": "Ⅲ-28", "theme": "水力発電", "q": "水力発電に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["流込み式発電所は，河川の自然流量を調整せずにそのまま発電に使用する方式である。", "有効落差は，総落差から取水口から放水口までの水路や水圧管路などにおける損失落差を差し引いたものである。", "水力発電所の出力P［kW］は，使用水量をQ［m³/s］，有効落差をH<sub>e<\/sub>［m］，水車及び発電機の合成効率をηとすると，P＝9.8・Q・H<sub>e<\/sub>・ηで表される。", "ペルトン水車は，低落差・大流量の地点に適した反動水車である。", "サージタンクは，負荷の急変に伴って圧力水路内に生じる水撃圧を軽減し，水位変動を吸収するための設備である。"], "ans": 4, "exp": "④が不適切。ペルトン水車はノズルから噴出する水の運動エネルギーを利用する <b>衝動水車<\/b> で，<b>高落差・小流量<\/b> の地点に適する。低落差・大流量にはカプラン水車（プロペラ水車）やバルブ水車，中落差にはフランシス水車が適する。<br>\n方式の分類：水路式・ダム式・ダム水路式（構造），流込み式・調整池式・貯水池式・揚水式（運用）。", "pts": "揚水式発電、渇水量・平水量・豊水量、水圧管路、放水路", "fig": "", "efig": "", "yobi": false}, {"id": "c29", "s": "ken", "sec": "道路", "secName": "道路", "no": "Ⅲ-29", "theme": "舗装の性能指標", "q": "道路の舗装の性能指標に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["平たん性は，車道の車線の中心線から1 mの線上において，延長方向に3 mプロフィルメータにより測定した路面の凹凸の標準偏差で表し，その値が大きいほど平たん性が良い。", "疲労破壊輪数は，舗装路面に49 kNの輪荷重を繰り返し加えた場合に，舗装にひび割れが生じるまでに要する回数である。", "塑性変形輪数は，舗装の表層の温度を高温に保ち，舗装路面に49 kNの輪荷重を繰り返し加えた場合に，舗装路面が下方に1 mm変位するまでに要する回数である。", "浸透水量は，雨水を道路の路面下に円滑に浸透させることができる構造とする場合に設定する性能指標であり，一定時間に路面下に浸透する水の量で表す。", "舗装の性能指標の値は，原則として施工直後の値とするが，施工直後の値だけでは性能の確認が不十分である場合には，必要に応じて供用後一定期間を経た時点での値を設定する。"], "ans": 1, "exp": "①が不適切。平たん性は凹凸の標準偏差σ［mm］で表し，<b>値が小さいほど平たん<\/b> である（凹凸が少ない）。<br>\n②〜⑤は「舗装の構造に関する技術基準」の内容。疲労破壊輪数は舗装計画交通量に応じて設定し，塑性変形輪数（わだち掘れ抵抗）は道路の区分・交通量に応じて設定する。排水性舗装の浸透水量の目安は1,000 mL/15 s以上。", "pts": "アスファルト舗装とコンクリート舗装の構成、排水性舗装、道路構造令（設計速度・建築限界・視距）", "fig": "", "efig": "", "yobi": false}, {"id": "c30", "s": "ken", "sec": "鉄道", "secName": "鉄道", "no": "Ⅲ-30", "theme": "鉄道の軌道構造", "q": "鉄道の軌道に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["軌間とは，両側のレール頭部の内側間の最短距離をいい，我が国の在来線の多くは1,067 mm，新幹線は1,435 mmである。", "カントとは，曲線区間を走行する車両に働く遠心力の影響を軽減するため，外側レールを内側レールより高くすることをいう。", "スラックとは，曲線区間において車輪がレールに円滑に沿って走行できるよう，軌間を直線区間よりも縮小することをいう。", "ロングレールは，レール継目を溶接によってなくしたもので，騒音・振動の低減や保守量の軽減に効果があるが，温度変化による軸力の管理が必要である。", "緩和曲線は，直線と円曲線の間などに挿入される曲率が漸変する曲線であり，カントやスラックの逓減もこの区間で行われる。"], "ans": 3, "exp": "③が不適切。スラックは曲線区間で軌間を <b>拡大<\/b> することをいう。車両の固定軸距があるため，急曲線では車輪のフランジがレールに押し付けられるので，内軌側を拡げて円滑な走行を確保する。<br>\nその他の頻出：スラブ軌道（プレキャストのコンクリートスラブ，保守量が少ない），バラスト軌道（道床の役割：荷重分散・排水・弾性），軌道変位（軌間・水準・高低・通り・平面性）。", "pts": "道床、まくら木、軌道変位の5項目、分岐器、索道・鋼索鉄道", "fig": "", "efig": "", "yobi": false}, {"id": "c31", "s": "ken", "sec": "トンネル", "secName": "トンネル", "no": "Ⅲ-31", "theme": "山岳トンネルの支保工", "q": "山岳トンネル工法の支保工に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["吹付けコンクリートは，掘削後できるだけ早期に地山に密着させて施工し，地山の緩みや肌落ちを防止する。", "ロックボルトは，トンネル壁面から地山内部に打設され，地山の縫付け効果，はり形成効果，内圧効果などにより地山を安定させる。", "鋼製支保工は，吹付けコンクリートが硬化するまでの早期に支保効果を発揮し，切羽の安定にも寄与する。", "NATMは，地山の持つ支保機能を有効に活用し，吹付けコンクリートやロックボルトなどで地山を安定させるとともに，計測により安全性を確認しながら掘削する工法である。", "覆工コンクリートは，原則として掘削直後に打設し，地山荷重の大部分を負担させる主たる支保部材として設計する。"], "ans": 5, "exp": "⑤が不適切。山岳工法（NATM）では，地山荷重は原則として支保工（吹付けコンクリート・ロックボルト・鋼製支保工）と地山自身で支持する。覆工コンクリートは <b>内空変位の収束を確認した後<\/b> に打設するのが原則で，仕上げ・耐久性確保・安全率向上などの役割を担う。<br>\n補助工法：先受け工（フォアポーリング等），鏡吹付け・鏡ボルト，インバートの早期閉合。", "pts": "掘削工法（全断面・補助ベンチ付き全断面・ベンチカット・導坑先進）、計測A・計測B、シールドの切羽安定機構", "fig": "", "efig": "", "yobi": false}, {"id": "c32", "s": "ken", "sec": "施工計画・施工設備及び積算", "secName": "施工計画・施工設備及び積算", "no": "Ⅲ-32", "theme": "土留め工", "q": "開削工事における土留め工に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["自立式土留め工は，切ばりや腹起しを用いず，主として根入れ部の地盤の抵抗によって土圧を支える方式で，比較的良質な地盤で浅い掘削に用いられる。", "ヒービングとは，地下水位の高い砂質地盤において，掘削底面付近の砂が上向きの浸透流によって沸騰したような状態となり，掘削底面が破壊する現象である。", "盤ぶくれとは，掘削底面下に難透水層があり，その下の被圧された帯水層の水圧によって掘削底面が持ち上げられる現象である。", "鋼矢板土留め壁は止水性が比較的良好であり，地下水位の高い地盤にも用いられる。", "ソイルセメント地下連続壁は，原位置の土とセメント系懸濁液を混合攪拌した壁体に芯材を挿入したもので，剛性と止水性が高く，施工時の騒音・振動が比較的小さい。"], "ans": 2, "exp": "②は <b>ボイリング<\/b> の説明であり不適切。ヒービングは，<b>軟弱な粘性土地盤<\/b> で掘削背面の土の重量が掘削底面下の地盤の支持力を上回り，背面土がまわり込んで掘削底面が隆起する現象である。<br>\n対策：ボイリング→根入れ長の確保・地下水位低下，ヒービング→根入れ長の確保・地盤改良，盤ぶくれ→ディープウェル等による被圧水頭の低減。", "pts": "親杭横矢板（止水性なし）、切ばり式・アンカー式、地盤改良工法（サンドコンパクション・バーチカルドレーン）", "fig": "", "efig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 460 192\" style=\"width:110mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"arA\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1c5cab\"/><\/marker><\/defs><text x=\"110\" y=\"16\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">ボイリング<\/text><path d=\"M10,30 L80,30 L80,100 L140,100 L140,30 L210,30 L210,170 L10,170 Z\" fill=\"#f4e7b8\" stroke=\"#1b1b1a\" stroke-width=\"1\"/><rect x=\"76\" y=\"22\" width=\"5\" height=\"120\" fill=\"#1b1b1a\"/><rect x=\"139\" y=\"22\" width=\"5\" height=\"120\" fill=\"#1b1b1a\"/><text x=\"110\" y=\"185\" text-anchor=\"middle\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">砂質地盤・高い地下水位<\/text><line x1=\"10\" y1=\"45\" x2=\"76\" y2=\"45\" stroke=\"#1c5cab\" stroke-dasharray=\"4 3\"/><text x=\"18\" y=\"41\" text-anchor=\"start\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"9\" font-weight=\"400\">地下水位<\/text><path d=\"M50,60 L50,150 L110,150 L110,104\" stroke=\"#1c5cab\" stroke-width=\"1.4\" marker-end=\"url(#arA)\"/><text x=\"110\" y=\"94\" text-anchor=\"middle\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"9\" font-weight=\"400\">上向き浸透流で砂が沸騰<\/text><text x=\"340\" y=\"16\" text-anchor=\"middle\" fill=\"#1b1b1a\" stroke=\"none\" font-size=\"12\" font-weight=\"700\">ヒービング<\/text><path d=\"M240,30 L310,30 L310,100 L370,100 L370,30 L440,30 L440,170 L240,170 Z\" fill=\"#d9d6cf\" stroke=\"#1b1b1a\" stroke-width=\"1\"/><rect x=\"306\" y=\"22\" width=\"5\" height=\"120\" fill=\"#1b1b1a\"/><rect x=\"369\" y=\"22\" width=\"5\" height=\"120\" fill=\"#1b1b1a\"/><text x=\"340\" y=\"185\" text-anchor=\"middle\" fill=\"#8a8883\" stroke=\"none\" font-size=\"10\" font-weight=\"400\">軟弱な粘性土地盤<\/text><path d=\"M275,40 L275,150 C300,165 335,150 340,104\" stroke=\"#1c5cab\" stroke-width=\"1.4\" marker-end=\"url(#arA)\"/><text x=\"340\" y=\"94\" text-anchor=\"middle\" fill=\"#1c5cab\" stroke=\"none\" font-size=\"9\" font-weight=\"400\">背面土がまわり込み底面隆起<\/text><\/svg>", "yobi": false}, {"id": "c33", "s": "ken", "sec": "施工計画・施工設備及び積算", "secName": "施工計画・施工設備及び積算", "no": "Ⅲ-33", "theme": "施工管理（品質・工程・原価）", "q": "建設工事の施工管理に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["品質管理では，PDCAサイクルを回しながら，ヒストグラムや管理図などを用いて品質のばらつきや工程の安定状態を確認する。", "x̄−R管理図は，データの平均値の変化と範囲（ばらつき）の変化を同時に管理するために用いられる。", "出来形管理とは，工事目的物の形状，寸法，数量などが設計図書に適合しているかを管理することである。", "工程と原価の関係では，施工速度を速めるほど単位数量当たりの原価は常に安くなるため，突貫工事とするほど経済的になる。", "ネットワーク式工程表のクリティカルパス上の作業に遅れが生じると，工事全体の工期が遅れる。"], "ans": 4, "exp": "④が不適切。施工速度を上げると当初は原価（単位数量当たり）が下がるが，<b>経済速度<\/b> を超えて突貫工事になると，残業・機械の追加・品質低下などにより原価は <b>逆に上昇<\/b> する。品質と原価も同様に，品質を高めるほど原価は上がる関係にある。<br>\n⑤クリティカルパスは開始から終了までの最長経路で，余裕（フロート）がゼロの作業の連なり。", "pts": "工程管理曲線（バナナ曲線）、ガントチャート・バーチャート、工事原価の構成（直接工事費・間接工事費）", "fig": "", "efig": "", "yobi": false}, {"id": "c34", "s": "ken", "sec": "建設環境", "secName": "建設環境", "no": "Ⅲ-34", "theme": "環境影響評価法", "q": "環境影響評価法に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["環境影響評価法は，環境基本法の制定と同じ1993年に制定・施行された。", "環境影響評価法では，規模が大きく環境に著しい影響を及ぼすおそれがある事業を第一種事業として必ず環境影響評価の対象とし，第一種事業に準ずる規模の事業を第二種事業として個別に対象とするかを判定（スクリーニング）する。", "2011年の法改正により，事業の位置・規模等の検討段階で環境保全のために配慮すべき事項を検討する計画段階環境配慮書の手続が導入された。", "方法書の手続（スコーピング）では，方法書を公告・縦覧し，環境保全の見地からの意見を広く求める。", "事業者は，工事の実施に当たって講じた環境保全措置や事後調査の結果などを記載した報告書を作成し，公表する。"], "ans": 1, "exp": "①が不適切。環境基本法は1993年制定だが，環境影響評価法は <b>1997年に制定<\/b>，1999年に全面施行された（それ以前は閣議決定要綱に基づく運用）。<br>\n手続の流れ：配慮書 → 方法書（スコーピング） → 準備書 → 評価書 → 報告書（2013年全面施行の改正で配慮書・報告書を追加）。対象事業は道路，ダム，鉄道，飛行場，発電所，埋立て・干拓など13種類。", "pts": "第一種・第二種事業、評価書に対する環境大臣意見、港湾計画は別枠", "fig": "", "efig": "", "yobi": false}, {"id": "c35", "s": "ken", "sec": "建設環境", "secName": "建設環境", "no": "Ⅲ-35", "theme": "建設環境（脱炭素・生物多様性等）", "q": "建設環境に関する次の記述のうち，最も不適切なものはどれか。", "opts": ["「生物多様性国家戦略2023-2030」では，2030年までに生物多様性の損失を止め反転させる「ネイチャーポジティブ」の実現や，陸と海の30 %以上を保全する「30by30」目標が掲げられている。", "2018年に気候変動適応法が施行され，温室効果ガスの排出削減対策（緩和策）とあわせて，気候変動の影響による被害の回避・軽減対策（適応策）が推進されている。", "我が国は，2030年度の温室効果ガス排出量を2013年度比で26 %削減することを目標として掲げており，2050年のカーボンニュートラルは目標としていない。", "グリーンインフラとは，社会資本整備や土地利用等のハード・ソフト両面において，自然環境が有する多様な機能を活用し，持続可能で魅力ある国土・都市・地域づくりを進める取組である。", "建設工事に係る資材の再資源化等に関する法律（建設リサイクル法）における特定建設資材は，コンクリート，コンクリート及び鉄から成る建設資材，木材，アスファルト・コンクリートの4品目である。"], "ans": 3, "exp": "③が不適切。我が国は2020年に <b>2050年カーボンニュートラル<\/b> を宣言し，2021年に2030年度の削減目標を <b>2013年度比46 %削減<\/b>（さらに50 %の高みに向け挑戦）に引き上げた（26 %は旧目標）。さらに2025年2月には，2035年度60 %削減・2040年度73 %削減（いずれも2013年度比）とする新たな目標（NDC）が示されている。<br>\n①2023年3月閣議決定。④国土形成計画・社会資本整備重点計画にも位置づけ。⑤建設リサイクル法の対象規模（建築物解体80 m²以上など）も頻出。", "pts": "侵略的外来種、SDGs（2015年採択）、騒音規制法・振動規制法の基準値、公害苦情件数", "fig": "", "efig": "", "yobi": false}, {"id": "c予1", "s": "ken", "sec": "予備", "secName": "河川、砂防及び海岸・海洋（水理学）", "no": "予1", "theme": "ベルヌーイの定理・連続の式", "q": "水平に置かれた管路において，断面1（内径0.40 m）の平均流速が2.0 m/sのとき，下流の断面2（内径0.20 m）における平均流速v<sub>2<\/sub>と，断面1と断面2の圧力水頭の差(p<sub>1<\/sub>−p<sub>2<\/sub>)/ρgの組合せとして，最も適切なものはどれか。ただし，損失は無視し，重力加速度g＝9.8 m/s²とする。", "opts": ["v<sub>2<\/sub>＝4.0 m/s，0.61 m", "v<sub>2<\/sub>＝8.0 m/s，6.12 m", "v<sub>2<\/sub>＝4.0 m/s，3.06 m", "v<sub>2<\/sub>＝8.0 m/s，3.06 m", "v<sub>2<\/sub>＝16.0 m/s，12.86 m"], "ans": 4, "exp": "連続の式 A<sub>1<\/sub>v<sub>1<\/sub>＝A<sub>2<\/sub>v<sub>2<\/sub>。断面積は内径の2乗に比例するので A<sub>1<\/sub>/A<sub>2<\/sub>＝(0.40/0.20)²＝4，v<sub>2<\/sub>＝4×2.0＝<b>8.0 m/s<\/b>。<br>\n水平管なので位置水頭は等しく，ベルヌーイの定理より (p<sub>1<\/sub>−p<sub>2<\/sub>)/ρg＝(v<sub>2<\/sub>²−v<sub>1<\/sub>²)/(2g)＝(64−4)/19.6＝<b>3.06 m<\/b>。流速が大きい断面ほど圧力は低い（ベンチュリ計の原理）。", "pts": "", "fig": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 160\" style=\"width:95mm\" font-family=\"Noto Sans CJK JP, sans-serif\" font-size=\"12\" fill=\"none\" stroke-linecap=\"round\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#1b1b1a\"/><\/marker><\/defs><path d=\ const NUM = "①②③④⑤";
const KEY = "gijutsushi-drill-v1";
let state = { s: "kiso", idx: { kiso: 0, ken: 0 }, ans: {}, revealed: {}, graded: { kiso: false, ken: false }, instant: true, onlyWrong: false, view: "q" };
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) state = Object.assign(state, saved, { view: "q" }); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
function list() {
  let l = DATA.filter(d => d.s === state.s);
  if (state.onlyWrong) { const w = l.filter(d => isShown(d) && state.ans[d.id] && state.ans[d.id] !== d.ans); if (w.length) l = w; }
  return l;
}
function isShown(d) { return state.instant ? !!state.ans[d.id] : (state.graded[d.s] || !!state.revealed[d.id]); }
function groups(items) {
  const g = []; const m = {};
  items.forEach(d => { if (!m[d.sec]) { m[d.sec] = { name: d.sec, full: d.secName, items: [] }; g.push(m[d.sec]); } m[d.sec].items.push(d); });
  return g;
}

function renderCells() {
  const items = list(); const cur = items[Math.min(state.idx[state.s], items.length - 1)];
  $("cells").innerHTML = groups(items).map(g => {
    const done = g.items.filter(d => state.ans[d.id]).length;
    const ok = g.items.filter(d => isShown(d) && state.ans[d.id] === d.ans).length;
    const shownN = g.items.filter(d => isShown(d)).length;
    return `<div class="grp"><div class="grp-h">${g.name}<span>${shownN ? `正解 ${ok}/${shownN}` : `${done}/${g.items.length} 解答`}</span></div><div class="cells">` +
      g.items.map(d => {
        const a = state.ans[d.id]; let cls = "cell";
        if (a) cls += isShown(d) ? (a === d.ans ? " ok" : " ng") : " done";

        const lab = String(d.no).replace("Ⅰ-", "").replace("Ⅲ-", "");
        return `<button class="${cls}" data-id="${d.id}" aria-label="${d.no}"><b>${lab}</b>${a ? NUM[a - 1] : "&nbsp;"}</button>`;
      }).join("") + `</div></div>`;
  }).join("");
  $("cells").querySelectorAll(".cell").forEach(b => b.onclick = () => { const l = list(); state.idx[state.s] = l.findIndex(d => d.id === b.dataset.id); state.view = "q"; render(); window.scrollTo({ top: 0 }); });

function renderScore() {
  const items = DATA.filter(d => d.s === state.s);
  const answered = items.filter(d => state.ans[d.id]).length;
  const shown = items.filter(d => isShown(d) && state.ans[d.id]);

function renderQ() {

    <div class="qtext">${d.q}</div>${d.fig ? `<div class="fig">${d.fig}</div>` : ""}<ol class="opts">${opts}</ol>${verdict}
    <div class="navrow"><button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>前の問題</button><button class="btn" id="next" ${i === items.length - 1 ? "disabled" : ""}>次の問題</button></div></article>`;

function renderResult() {

  } else {

  }
  const scoreLine = state.s === "kiso" ? `${ok.length}<small> / ${ans.length}問 正解</small>` : `${ok.filter(d => !d.yobi).length}<small> / ${ans.filter(d => !d.yobi).length}問 正解（予備問題を除く）</small>`;
  $("main").innerHTML = `<section class="result"><h2>${state.s === "kiso" ? "基礎科目" : "建設部門"}の採点結果</h2>

    <div class="pass ${judge ? "ok" : "ng"}">${judge ? "合格ラインに達しています" : "合格ラインまであと " + ((state.s === "kiso" ? 8 : 13) - (state.s === "kiso" ? ok.length : ok.filter(d => !d.yobi).length)) + " 問"}</div>
    <table class="rtable"><thead><tr><th>分野</th><th class="n">正解 / 解答</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <p class="note">${note} 解答用紙の赤い番号が間違えた問題です。番号を押すと解説を確認できます。</p>

  $("back").onclick = () => { state.view = "q"; render(); };

function render() {

  $("instant").checked = state.instant; $("onlyWrong").checked = state.onlyWrong;
  $("grade").textContent = state.graded[state.s] || state.instant ? "結果を見る" : "採点する";

document.querySelectorAll(".subjects button").forEach(b => b.onclick = () => { state.s = b.dataset.s; state.view = "q"; save(); render(); });
$("instant").onchange = e => { state.instant = e.target.checked; save(); render(); };
$("onlyWrong").onchange = e => { state.onlyWrong = e.target.checked; state.idx[state.s] = 0; save(); render(); };
$("grade").onclick = () => { state.graded[state.s] = true; state.view = "r"; save(); render(); window.scrollTo({ top: 0 }); };
function bindReset() {
  $("reset").onclick = () => {
    $("resetBox").innerHTML = `<div class="confirm">消してよいですか？ <button class="btn danger" id="resetYes">消す</button><button class="btn quiet" id="resetNo">やめる</button></div>`;
    $("resetYes").onclick = () => { DATA.filter(d => d.s === state.s).forEach(d => { delete state.ans[d.id]; delete state.revealed[d.id]; }); state.graded[state.s] = false; state.idx[state.s] = 0; state.view = "q"; save(); restoreReset(); render(); };
    $("resetNo").onclick = restoreReset;
  };
}
function restoreReset() { $("resetBox").innerHTML = `<button class="btn quiet" id="reset">この科目の解答をすべて消す</button>`; bindReset(); }
bindReset();
document.addEventListener("keydown", e => {
  if (state.view !== "q" || e.target.tagName === "INPUT") return;
  if (/^[1-5]$/.test(e.key)) { const b = document.querySelector(`.opt[data-k="${e.key}"]:not(:disabled)`); if (b) b.click(); }
  if (e.key === "ArrowRight" && $("next") && !$("next").disabled) $("next").click();
  if (e.key === "ArrowLeft" && $("prev") && !$("prev").disabled) $("prev").click();
});
render();
</script>

</body></html>
